<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e2;--tx:#2b2617;--soft:#4c4634;--dim:#746d59;--gold:#9b6a10;--acc:#d9a93a;--onacc:#241b06;

--sea:#cfe3e8;--land:#efe9d6;--landln:#cbbf9f;--mk:#fffdf6;--vnfill:rgba(217,169,58,.24);--pinbg:#fffdf6;--pinseen:#f3e2b3;--pinseentx:#5b3d05;

--glass:rgba(19,25,22,.92);--glass2:rgba(14,20,17,.8);--scrim:rgba(10,15,12,.74);--line:rgba(215,181,109,.3);--line2:rgba(245,238,223,.25);--field:rgba(255,255,255,.07);
--hdr:linear-gradient(180deg,rgba(10,15,12,.85),transparent);--sh:0 8px 28px rgba(0,0,0,.45);--ok:#6fd199;--bad:#f0907e;--okbg:rgba(111,209,153,.14);--badbg:rgba(240,144,126,.13);
--sea:#0e1a1b;--land:#16211e;--landln:#2a3a34;--mk:#101714;--vnfill:rgba(215,181,109,.14);--pinbg:rgba(16,22,19,.88);--pinseen:#3b3420;--pinseentx:#e8d29a;
--c-thanh:#d7b56d;--c-den:#7fb69a;--c-pho:#e0894a;--c-cm:#d9604f;--c-tn:#6fb2d6;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Be Vietnam Pro","Segoe UI",Arial,sans-serif}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#scene{position:fixed;inset:0}canvas{display:block;touch-action:none}
header{position:fixed;z-index:5;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 4vw 12px;display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;background:var(--hdr);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.seal{width:32px;height:32px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:20px Georgia,serif;background:var(--glass2)}
nav{display:flex;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:var(--soft);font-size:12px;letter-spacing:.08em;padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}nav button:hover,nav button.on{color:var(--gold);border-color:var(--gold)}nav button.ic{font-size:16px;line-height:1;padding:7px 10px;border-bottom-color:transparent}
#view{position:fixed;inset:0;z-index:3;overflow-y:auto;padding:calc(100px + env(safe-area-inset-top,0px)) 5vw 60px;background:var(--scrim)}#view.hide{display:none}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:12px}
h1{font:400 clamp(30px,5vw,56px)/1.05 "Noto Serif",Georgia,serif;margin:0 0 14px;text-wrap:balance}h1 em{color:var(--gold);font-style:normal}
h2.sec{font:400 26px "Noto Serif",Georgia,serif;margin:44px 0 10px}
.lead{max-width:680px;color:var(--soft);font-size:14px;line-height:1.8;margin:0 0 26px}
.lnk{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;max-width:380px;background:var(--field);border:1px solid var(--line2);color:var(--tx);padding:10px 12px;font:13px "Be Vietnam Pro",sans-serif}
.count{font-size:11px;letter-spacing:.1em;color:var(--dim)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--glass2);border:1px solid var(--line2);color:var(--soft);padding:8px 14px;font-size:11px;letter-spacing:.08em;cursor:pointer}.chip.on,.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip i,.tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,var(--gold));margin-right:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:22px}
.empty{color:var(--dim);font-size:13px}
.card{background:var(--glass);border:1px solid var(--line);padding:20px;cursor:pointer;transition:.2s;text-align:left;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh)}.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card .ph{height:0;overflow:hidden;margin:-20px -20px 0;transition:height .35s;background:var(--field)}.card .ph.on{height:150px}.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.card:hover .ph img{transform:scale(1.04)}
.card .sw{height:6px;margin:0 -20px 16px;background:var(--c,var(--gold))}.card small{color:var(--gold);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.card h3{font:400 22px "Noto Serif",serif;margin:8px 0}.card p{font-size:12.5px;line-height:1.7;color:var(--soft);margin:0 0 12px}.card .tags{margin-top:auto}.card .go{color:var(--gold);font-size:11px;letter-spacing:.1em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tag{font:400 10.5px "Be Vietnam Pro",sans-serif;letter-spacing:.04em;padding:3px 8px;border:1px solid var(--line2);color:var(--soft);background:var(--glass2)}.tag.u{border-color:var(--gold);color:var(--gold)}.tag.ok{border-color:var(--ok);color:var(--ok)}
button.tag{cursor:pointer}button.tag:hover{border-color:var(--gold);color:var(--gold)}
.tl{position:relative;max-width:780px;margin:10px 0 0 8px;padding-left:34px;border-left:1px solid var(--gold)}
.era{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:34px 0 14px;scroll-margin-top:110px}.era:first-child{margin-top:0}.era:before{content:"";position:absolute;left:-34px;top:.7em;width:26px;height:1px;background:var(--gold)}
.era b{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}.era span{font-size:11px;color:var(--dim)}
.tn{position:relative;margin-bottom:22px;cursor:pointer;background:var(--glass);border:1px solid var(--line);padding:16px 18px;width:100%;text-align:left;display:block}.tn:hover{border-color:var(--gold)}
.tn:before{content:"";position:absolute;left:-42px;top:22px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--c,var(--gold))}
.tn b{font:400 26px "Noto Serif",serif;color:var(--gold)}.tn h3{margin:4px 0;font-size:16px;font-weight:600}.tn p{margin:0 0 10px;font-size:12.5px;line-height:1.7;color:var(--soft)}.tn .tags{margin:0}
.mapwrap{display:grid;grid-template-columns:minmax(300px,520px) minmax(0,1fr);gap:28px;align-items:start}
.map{border:1px solid var(--line);background:var(--sea);line-height:0}.map svg{display:block;width:100%;height:auto}
.m-sea{fill:var(--sea)}.m-nb{fill:var(--land);stroke:var(--landln);stroke-width:.8}.m-vn{fill:var(--vnfill);stroke:var(--gold);stroke-width:1.2;stroke-linejoin:round}.m-gl{stroke:var(--tx);stroke-opacity:.09}.m-gt{fill:var(--tx);fill-opacity:.4}.m-ct{fill:var(--tx);fill-opacity:.32}.m-ar{fill:var(--gold);fill-opacity:.85}
.mk{cursor:pointer;outline:none;color:var(--gold)}.mk .ring{fill:var(--mk);stroke:currentColor}.mk .dot{fill:currentColor}.mk .num{fill:currentColor;font-weight:700}.mk .sel{fill:none;stroke:var(--gold)}.mk:focus-visible .ring,.mk:hover .ring{stroke:var(--tx)}
.mk .lbl{fill:var(--tx);font-weight:600;paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;pointer-events:none}
.mlist h3{font:400 20px "Noto Serif",serif;margin:0 0 4px}.mlist .sub{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:18px 0 8px}.mlist .sub:first-of-type{margin-top:0}
.mitem{display:flex;gap:12px;align-items:baseline;justify-content:space-between;width:100%;text-align:left;background:var(--glass);border:1px solid var(--line);padding:11px 14px;margin-bottom:8px;cursor:pointer}.mitem:hover,.mitem.hot{border-color:var(--gold)}.mitem b{font-weight:600;font-size:13.5px}.mitem span{font-size:11px;color:var(--dim);white-space:nowrap}
.tech{padding-left:20px}.tech li{margin-bottom:12px;font-size:13.5px;line-height:1.7;color:var(--soft);max-width:700px}.tech b{color:var(--gold)}.tech .ok{display:inline-block;font-size:10px;letter-spacing:.08em;border:1px solid var(--gold);color:var(--gold);padding:1px 6px;margin-left:6px;white-space:nowrap}
.guide{max-width:700px;font-size:13px;line-height:1.8;color:var(--soft)}.guide code{background:var(--field);padding:1px 5px;font-size:12px}
.mgr{max-width:1000px;border:1px solid var(--line);background:var(--glass);margin:14px 0}.mgr .sh{padding:10px 14px;font:600 13px "Be Vietnam Pro",sans-serif;color:var(--gold);border-bottom:1px solid var(--line);background:var(--field)}
.mrow{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 78px;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line2);font-size:12.5px}.mrow.sp{padding-left:28px;color:var(--soft)}
.mrow input{width:100%;min-width:0;background:var(--field);border:1px solid var(--line2);color:var(--tx);padding:6px 8px;font:12px "Be Vietnam Pro",sans-serif}.mrow .st{font-size:10.5px;color:var(--dim)}.mrow .st.on{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mrow .st.bad,.mc .st.bad{color:var(--bad);font-weight:600}.mfind{padding:10px 0;margin-bottom:6px;max-width:1000px}.mfind input{width:100%;background:var(--glass);border:1px solid var(--line2);color:var(--tx);padding:11px 14px;font:14px "Be Vietnam Pro",sans-serif}.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mchips .chip{padding:5px 10px;font-size:10.5px}.mgs.shut .mrow3{display:none}.mgs[hidden]{display:none}.mgr .sh{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;cursor:pointer;border:0;border-bottom:1px solid var(--line)}.mgr .sh i{font-style:normal;font:400 10.5px "Be Vietnam Pro",sans-serif;color:var(--dim)}
.mhd,.mrow3{display:grid;grid-template-columns:minmax(100px,200px) minmax(70px,1fr) minmax(250px,2fr);gap:10px;align-items:start;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:12.5px}.mhd{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:var(--field)}.mrow3.sp{color:var(--soft)}.mrow3.sp>span:first-child{padding-left:14px}.mrow3>span:first-child{padding-top:7px}.mc{display:flex;flex-direction:column;gap:3px;min-width:0}.mc input{width:100%;min-width:0;background:var(--field);border:1px solid var(--line2);color:var(--tx);padding:6px 8px;font:12px "Be Vietnam Pro",sans-serif}.ifld.drop{outline:2px dashed var(--gold);outline-offset:2px}.ifld{display:flex;gap:6px;align-items:center}.ifld input[type=url]{flex:1}.fbtn{white-space:nowrap;cursor:pointer;padding:7px 9px}.mc .st{font-size:10.5px;color:var(--dim);min-height:1em}.mc .st.on{color:var(--gold)}
/* ---- khung tham quan 3D ---- */
#hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}#hud.on{display:block}
.vbk{margin-bottom:18px}#back{position:absolute;left:4vw;top:calc(84px + env(safe-area-inset-top,0px));pointer-events:auto}
.sitebox{position:absolute;left:4vw;top:calc(130px + env(safe-area-inset-top,0px));max-width:min(410px,90vw);padding:14px 16px 6px;background:var(--glass2);border-left:3px solid var(--gold);box-shadow:var(--sh);pointer-events:none;z-index:2}
.sitebox h1{font-size:clamp(26px,4vw,42px);margin-bottom:8px}.sitebox .eyebrow{margin-bottom:8px}
.sitebox p{font-size:12.5px;line-height:1.7;color:var(--soft);margin:0 0 10px}
.sitebox .tags,.sitebox .snav,.sitebox .more,.sitebox .sacts{pointer-events:auto}.sitebox .tag{background:var(--glass)}
.prog{font-size:11px;color:var(--dim);margin:-2px 0 10px;letter-spacing:.04em}.prog b{color:var(--ok);font-weight:600}
.sacts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.sacts .btn{padding:8px 14px}
.snav{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;margin-bottom:8px}.snav button{background:none;border:0;padding:0;cursor:pointer;color:var(--soft)}.snav button:hover{color:var(--gold)}
.sitebox .more{display:none;background:none;border:0;padding:0 0 10px;color:var(--gold);font-size:11px;letter-spacing:.08em;cursor:pointer}
.panel{position:absolute;right:4vw;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(370px,90vw);padding:20px 22px 22px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh);pointer-events:auto;max-height:62vh;overflow:auto;z-index:3}.panel.hide{display:none}
.panel small{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:10px;display:block;padding-right:28px}.panel h2{font:400 26px "Noto Serif",serif;margin:10px 0}.panel p{font-size:13px;line-height:1.75;color:var(--soft);margin:0 0 14px}.panel .tags{margin:-2px 0 10px}
.panel .x{position:absolute;right:8px;top:6px;width:30px;height:30px;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--tx);opacity:.7;z-index:2}.panel .x:hover{opacity:1;color:var(--gold)}
.panel .ph{margin:18px 0 14px}
figure.ph{margin:0;position:relative}figure.rv{background:none;border-radius:12px}
.rvb{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 14px;background:var(--glass2);border:1px solid var(--line);border-radius:12px;color:var(--gold);font:600 11px "Be Vietnam Pro",sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}.rvb:hover{border-color:var(--gold);transform:translateY(-1px)}.rvb:active{transform:scale(.97)}.rvb i{font-style:normal;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}.rv.open .rvb i{transform:rotate(180deg)}
.rvw{display:none}
#pop{position:fixed;z-index:10;border-radius:14px;overflow:hidden;background:var(--glass);border:1px solid var(--gold);box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:scale(.35) rotate(-3deg);transition:opacity .25s ease,transform .7s cubic-bezier(.34,1.56,.64,1),visibility 0s .7s;cursor:zoom-out}
#pop.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s ease,transform .7s cubic-bezier(.34,1.56,.64,1)}
#pop img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}#pop figcaption{font-size:11px;line-height:1.5;color:var(--dim);padding:7px 12px}#pop figcaption a{color:var(--dim)}
figure.ph img{display:block;width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;cursor:zoom-in}
figure.ph figcaption{font-size:10px;line-height:1.5;color:var(--dim);padding:5px 12px;background:var(--glass2)}figure.ph figcaption a{color:var(--dim)}figure.ph figcaption a:hover{color:var(--gold)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
#hud.spot .sitebox{display:none}
@media(min-width:701px){#hud.spot .panel{left:4vw;right:auto;bottom:auto;top:calc(130px + env(safe-area-inset-top,0px));max-height:calc(100% - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5}.facts dt{color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding-top:2px}.facts dd{margin:0;color:var(--tx)}.facts:empty{display:none}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}.linkrow input{flex:1;min-width:140px;background:var(--field);border:1px solid var(--line2);color:var(--tx);padding:9px;font:12px "Be Vietnam Pro",sans-serif}
.btn{border:1px solid var(--gold);padding:9px 14px;background:var(--acc);color:var(--onacc);font:700 11px "Be Vietnam Pro",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{filter:brightness(1.06)}.btn.ghost{background:var(--glass2);color:var(--tx);border-color:var(--line2)}.btn.ghost:hover,.btn.ghost.on{border-color:var(--gold);color:var(--gold)}.btn.sm{padding:7px 11px;font-size:10.5px}.btn:disabled{opacity:.45;cursor:default}
.lk{background:none;border:0;color:var(--dim);font-size:11px;cursor:pointer;text-decoration:underline;margin-left:8px}.lk:hover{color:var(--gold)}
.note{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5}
#pins{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.pin{position:absolute;left:0;top:0;width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--gold);background:var(--pinbg);color:var(--gold);font:700 12px "Be Vietnam Pro",sans-serif;display:grid;place-items:center;cursor:pointer;pointer-events:auto;box-shadow:0 2px 10px rgba(30,20,0,.35);will-change:transform,opacity;touch-action:manipulation}.pin:hover{background:var(--glass)}
.pin.seen{background:var(--pinseen);color:var(--pinseentx)}.pin.on{background:var(--acc);color:var(--onacc);box-shadow:0 0 0 4px rgba(217,169,58,.4),0 2px 10px rgba(30,20,0,.35)}
.bottom{position:absolute;left:4vw;right:4vw;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;pointer-events:auto;padding-bottom:4px;z-index:3}
.loc{flex:0 0 auto;background:var(--glass2);border:1px solid var(--line2);color:var(--soft);padding:10px 13px;font-size:10.5px;letter-spacing:.06em;cursor:pointer;box-shadow:0 2px 10px rgba(30,20,0,.12)}.loc.on,.loc:hover{border-color:var(--gold);color:var(--gold)}.loc.tour{border-color:var(--gold);color:var(--gold)}.loc.tour.on{background:var(--acc);color:var(--onacc)}
.loc.seen:before{content:"✓ ";color:var(--ok);font-weight:700}
#tip{position:fixed;z-index:3;right:4vw;top:calc(92px + env(safe-area-inset-top,0px));font-size:10px;letter-spacing:.12em;color:var(--soft);text-align:right;pointer-events:none;display:none;background:var(--glass2);border:1px solid var(--line2);padding:5px 10px}#hud.on~#tip{display:block}
#msg{position:fixed;z-index:12;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2617;color:#f5eedf;border:1px solid var(--acc);padding:10px 16px;font-size:12px;max-width:90vw;display:none;box-shadow:var(--sh)}
/* ---- hộp thoại Nội dung / Xem thêm ---- */
.modal{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(24,18,6,.52);padding:4vh 4vw}
.sheet{width:min(800px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.4);background-color:var(--bg)}

 {n:'Thành Nội & Đền Thượng',t:'Đền thờ An Dương Vương nằm ở trung tâm khu di tích, dựng trên gò đất được ví như đầu rồng, trước đền là hồ nước có giếng Ngọc. Khảo cổ ở khu vực này từng tìm thấy lò đúc và khuôn đúc mũi tên đồng ba cạnh.',pos:[0,2.5,-7],r:26,th:.15,ph:1.2,link:''},
 {n:'Giếng Ngọc',t:'Theo truyền thuyết, đây là nơi Trọng Thủy gieo mình vì hối hận sau cái chết của Mỵ Châu. Một cách giải thích khác cho rằng ngọc trai nhuốm máu Mỵ Châu được rửa ở đây nên sáng đẹp hơn.',pos:[0,0,6],r:19,th:.2,ph:1.15,link:''},
 {n:'Am Mỵ Châu',t:'Am thờ công chúa Mỵ Châu, nằm gần Đền Thượng và gắn với truyền thuyết nỏ thần.',pos:[13,2,7],r:17,th:.4,ph:1.2,link:'https://vi.wikipedia.org/wiki/Mỵ_Châu'},
 {n:'Đình Cổ Loa',t:'Đình Ngự Triều Di Quy, kiến trúc thời Hậu Lê, là nơi diễn ra các nghi lễ truyền thống của lễ hội Cổ Loa.',pos:[-13,2.5,8],r:18,th:-.4,ph:1.2,link:''}]},
{id:'my-son',name:'Thánh địa Mỹ Sơn',city:'Đà Nẵng (Quảng Nam cũ)',prov:'Đà Nẵng',reg:'Trung',type:'den',year:'Thế kỷ IV–XIII',yn:380,unesco:'Di sản thế giới 1999',ll:[15.7646,108.1239],bg:0x8fa58a,
 text:'Quần thể đền tháp Chăm Pa bằng gạch nung, dựng từ cuối thế kỷ IV đến thế kỷ XIII, nơi các vua Chăm cúng thần và tôn vinh tổ tiên. UNESCO ghi danh năm 1999.',
 link:'https://vi.wikipedia.org/wiki/Thánh_địa_Mỹ_Sơn',cam:[0,4,0,48,.6,1.1],
 spots:[{n:'Nhóm A (A1)',t:'Tháp chính A1 cao khoảng 24 m, từng được coi là đỉnh cao nghệ thuật kiến trúc Chăm. Nhóm A bị bom phá hủy nặng nề năm 1969, hiện chủ yếu còn là phế tích.',pos:[0,3,-4],r:22,th:.5,ph:1.15,link:''},
 {n:'Nhóm B – C',t:'Các tháp nhóm B, C còn khá nguyên vẹn, cho thấy lối xây gạch kín khít và hoa văn trang trí trên tường tháp; tháp B5 được xem là hình mẫu tiêu biểu còn lại của phong cách Mỹ Sơn A1.',pos:[-14,3,4],r:22,th:-.5,ph:1.15,link:''},
 {n:'Nhóm D',t:'Nhóm D gồm các công trình được bảo tồn khá tốt (khoảng thế kỷ X–XI); một số ngôi nhà ở đây từng được cải tạo làm nơi trưng bày hiện vật điêu khắc đá Chăm như tượng thần, bệ thờ, linga – yoni.',pos:[14,2,6],r:20,th:.9,ph:1.2,link:''},
 {n:'Thung lũng Mỹ Sơn',t:'Thánh địa nằm trong thung lũng rộng khoảng 2 km, bao quanh bởi hai dãy núi. Người Chăm coi đây là ngọn núi thiêng Mahaparvata, gắn với dòng sông thiêng Mahanadi (sông Thu Bồn).',pos:[0,6,-20],r:45,th:2.4,ph:1.1,link:''}]},
{id:'hoa-lu',name:'Cố đô Hoa Lư',city:'Ninh Bình',prov:'Ninh Bình',reg:'Bắc',type:'thanh',year:'968',yn:968,unesco:'Di sản thế giới 2014 (Tràng An)',ll:[20.275,105.9],bg:0xa9bcb0,
 text:'Kinh đô đầu tiên của nước Đại Cồ Việt dưới thời Đinh và Tiền Lê (968–1009), nằm giữa những dãy núi đá vôi làm thành lũy tự nhiên. Năm 1010 Lý Thái Tổ dời đô ra Thăng Long. Hoa Lư là một phần của Quần thể danh thắng Tràng An.',
 link:'https://vi.wikipedia.org/wiki/Cố_đô_Hoa_Lư',cam:[0,0,0,105,.35,.95],
 spots:[{n:'Thành Đông – Thành Tây',t:'Kinh đô gồm hai khu thành là Thành Đông và Thành Tây, tận dụng núi đá vôi bao quanh làm bức tường phòng thủ tự nhiên. Khu Thành Đông rộng khoảng 140 ha, có đền vua Đinh và đền vua Lê ở trung tâm.',pos:[0,0,0],r:105,th:.35,ph:.95,link:''},
 {n:'Đền vua Đinh Tiên Hoàng',t:'Đền thờ Đinh Tiên Hoàng (Đinh Bộ Lĩnh), người dựng nên nhà Đinh và đóng đô ở Hoa Lư. Đền được dựng từ thời Lý, xây lại từ thời Hậu Lê theo kiểu “nội công ngoại quốc”.',pos:[-14,3,-6],r:21,th:.2,ph:1.2,link:'https://vi.wikipedia.org/wiki/Đền_thờ_Vua_Đinh_Tiên_Hoàng'},
 {n:'Đền vua Lê Đại Hành',t:'Đền thờ Lê Đại Hành, cách đền vua Đinh khoảng 300 m, được dựng trên nền cung điện cũ của kinh đô Hoa Lư.',pos:[17,3,-4],r:21,th:.2,ph:1.2,link:'https://vi.wikipedia.org/wiki/Đền_thờ_Vua_Lê_Đại_Hành'},
 {n:'Chùa Nhất Trụ & cột kinh',t:'Chùa nằm gần đền vua Lê, nổi tiếng với cột kinh đá khắc kinh Phật thời Đinh, được xem là thạch kinh cổ nhất Việt Nam (thế kỷ X).',pos:[39,2,6],r:17,th:.3,ph:1.2,link:'https://vi.wikipedia.org/wiki/Chùa_Nhất_Trụ'},
 {n:'Lăng vua Đinh – núi Mã Yên',t:'Lăng vua Đinh nằm trên đỉnh núi Mã Yên; lăng vua Lê Đại Hành ở dưới chân núi.',pos:[-18,20,-28],r:26,th:.3,ph:1.1,link:''}]},
{id:'thang-long',name:'Hoàng thành Thăng Long',city:'Hà Nội',prov:'Hà Nội',reg:'Bắc',type:'thanh',year:'1010',yn:1010,unesco:'Di sản thế giới 2010',ll:[21.0367,105.84],bg:0x9ba69b,
 text:'Trung tâm quyền lực của nhiều triều đại, bắt đầu từ khi Lý Thái Tổ dời đô năm 1010. UNESCO ghi danh năm 2010.',
 link:'https://vi.wikipedia.org/wiki/Hoàng_thành_Thăng_Long',cam:[0,2,0,56,.63,1.15],
 spots:[{n:'Đoan Môn',t:'Cổng phía Nam của Hoàng thành, có năm lối vào, dẫn tới trục nghi lễ chính. Phần còn lại hiện nay có từ thời Lê sơ, về sau được tu bổ dưới thời Nguyễn.',pos:[0,2,20],r:29,th:.05,ph:1.1,link:'https://vi.wikipedia.org/wiki/Đoan_Môn'},
 {n:'Điện Kính Thiên',t:'Công trình trung tâm của Hoàng thành, nơi cử hành các nghi lễ quan trọng của triều đình. Ngày nay chỉ còn nền điện và thềm rồng đá thời Lê sơ.',pos:[0,2,-7],r:28,th:.55,ph:1.2,link:'https://vi.wikipedia.org/wiki/Điện_Kính_Thiên'},
 {n:'Hậu Lâu',t:'Còn gọi là Tĩnh Bắc Lâu hay lầu Công chúa, được dựng phía sau cụm điện Kính Thiên.',pos:[0,3,-23],r:27,th:.45,ph:1.15,link:''},
 {n:'Cột cờ Hà Nội',t:'Khởi công năm 1805, hoàn thành năm 1812 cùng thời với thành Hà Nội thời Nguyễn. Cột gồm ba tầng đế hình chóp cụt và thân cột, cao khoảng 33 m (hơn 40 m tính cả cán cờ).',y:'1805–1812',pos:[-27,8,1],r:27,th:-.7,ph:1.2,link:'https://vi.wikipedia.org/wiki/Cột_cờ_Hà_Nội'},
 {n:'Khu khảo cổ 18 Hoàng Diệu',t:'Nơi khai quật nhiều tầng văn hóa chồng lên nhau, từ thành Đại La thời Đường đến các cung điện Lý, Trần, Lê và kiến trúc thành Hà Nội thế kỷ XIX, cho thấy sự tiếp nối nhiều thế kỷ của kinh thành.',pos:[14,1,-8],r:26,th:.4,ph:1.25,link:''}]},
{id:'van-mieu',name:'Văn Miếu – Quốc Tử Giám',city:'Hà Nội',prov:'Hà Nội',reg:'Bắc',type:'den',year:'1070',yn:1070,unesco:'Bia Tiến sĩ · Di sản tư liệu UNESCO',ll:[21.0286,105.8355],bg:0x9fae9a,
 text:'Xây năm 1070 thờ Khổng Tử; năm 1076 lập Quốc Tử Giám – trường đại học đầu tiên của Việt Nam.',
 link:'https://vi.wikipedia.org/wiki/Văn_Miếu_–_Quốc_Tử_Giám',cam:[0,2,-2,46,.5,1.1],
 spots:[{n:'Cổng Văn Miếu Môn',t:'Cổng chính ngoài cùng, mở đầu trục thần đạo đi qua nhiều lớp sân.',pos:[0,2,24],r:24,th:0,ph:1.3,link:''},
 {n:'Khuê Văn Các',t:'Gác dựng năm 1805 trên bốn trụ gạch, được chọn làm biểu tượng của Thủ đô Hà Nội. Khuê là sao tượng trưng cho văn chương.',y:'1805',pos:[0,5.5,15],r:17,th:.8,ph:1.2,link:''},
 {n:'Giếng Thiên Quang & Bia Tiến sĩ',t:'Hai bên giếng Thiên Quang là 82 bia đá đặt trên lưng rùa, ghi tên các tiến sĩ của những khoa thi từ 1442 đến 1779 (bia được dựng từ năm 1484 đến 1780). Bộ bia được UNESCO ghi vào danh sách Di sản tư liệu thế giới.',y:'1484–1780',pos:[0,1,6],r:20,th:-.7,ph:1.2,link:'https://vi.wikipedia.org/wiki/Bia_tiến_sĩ_Văn_Miếu_Thăng_Long'},
 {n:'Đại Thành Môn & Đại Thành',t:'Khu thờ Khổng Tử và các bậc hiền triết, là điện chính của Văn Miếu.',pos:[0,3,-8],r:20,th:.3,ph:1.2,link:''},
 {n:'Nhà Thái Học',t:'Khu Quốc Tử Giám được dựng phía sau, kế thừa nơi học tập của các thế hệ nho sinh.',pos:[0,3,-19],r:20,th:.9,ph:1.2,link:''}]},
{id:'thanh-nha-ho',name:'Thành nhà Hồ',city:'Thanh Hóa',prov:'Thanh Hóa',reg:'Trung',type:'thanh',year:'1397',yn:1397,unesco:'Di sản thế giới 2011',ll:[20.075,105.605],bg:0xa5b0a0,
 text:'Kinh đô Tây Đô do Hồ Quý Ly cho xây năm 1397, chỉ trong khoảng ba tháng. Thành nổi tiếng với tường và cổng xây bằng những khối đá lớn xếp khít, một tòa thành đá hiếm có ở Đông Nam Á. UNESCO ghi danh năm 2011.',
 link:'https://vi.wikipedia.org/wiki/Thành_nhà_Hồ',cam:[8,3,14,100,.6,1],
 spots:[{n:'Cổng Nam',t:'Cổng lớn nhất trong bốn cổng, mở ba cửa vòm cuốn bằng đá; cửa giữa cao khoảng 8 m, rộng gần 6 m. Trên cổng Nam và cổng Bắc từng có vọng lâu để canh gác và duyệt quân.',pos:[0,5,32],r:26,th:.25,ph:1.3,link:''},
 {n:'Tường thành đá',t:'Tường thành xây bằng những khối đá lớn đẽo vuông vắn, xếp khít chồng lên nhau, có khối nặng từ hơn chục đến hàng chục tấn. Mỗi cạnh của Hoàng thành dài gần 900 m.',pos:[-32,5,6],r:26,th:-1,ph:1.25,link:''},
 {n:'Nền điện Hoàng Nguyên',t:'Điện Hoàng Nguyên (chính điện) là nơi thiết triều và tế lễ. Khảo cổ cho thấy lớp kiến trúc thời Hồ nằm dưới mặt đất khoảng 1–1,5 m, mặt bằng còn gần như nguyên vẹn; hiện chỉ còn dấu tích nền móng.',pos:[0,1,-6],r:24,th:.3,ph:1.1,link:''},
 {n:'Đường Hoàng Gia',t:'Con đường dài khoảng 3,5 km do nhà Hồ xây năm 1402, nối Hoàng thành với Đàn tế Nam Giao; dấu tích được phát hiện qua khai quật cổng Nam năm 2008.',y:'1402',pos:[20,0,54],r:30,th:-.5,ph:1.15,link:''},
 {n:'Đàn tế Nam Giao',t:'Nằm dưới chân núi Đốn Sơn, cách Hoàng thành khoảng 2,5 km về phía đông nam; khảo cổ cho thấy nền đàn gồm năm tầng bó đá, tổng diện tích khoảng 30.000 m².',pos:[40,2,66],r:22,th:.6,ph:1.2,link:''}]},
{id:'hoi-an',name:'Phố cổ Hội An',city:'Đà Nẵng (Quảng Nam cũ)',prov:'Đà Nẵng',reg:'Trung',type:'pho',year:'Thế kỷ XVI–XVII',yn:1550,unesco:'Di sản thế giới 1999',ll:[15.8801,108.338],bg:0xb7b79d,
 text:'Thương cảng quốc tế sầm uất, nơi người Việt, Hoa, Nhật giao thoa. UNESCO ghi danh năm 1999.',
 link:'https://vi.wikipedia.org/wiki/Phố_cổ_Hội_An',cam:[0,2,0,40,.4,1.1],
 spots:[{n:'Chùa Cầu',t:'Cầu mái ngói bắc qua lạch nước, do cộng đồng thương nhân Nhật góp tiền xây vào khoảng thế kỷ XVII nên còn gọi là cầu Nhật Bản. Cầu được dựng lại năm 1817 và đại trùng tu giai đoạn 2022–2024.',y:'Thế kỷ XVII',pos:[0,1.5,-14],r:24,th:.9,ph:1.28,link:'https://vi.wikipedia.org/wiki/Chùa_Cầu'},
 {n:'Dãy nhà phố cổ',t:'Những ngôi nhà ống gỗ, mái ngói âm dương san sát, vừa để ở vừa buôn bán.',pos:[0,2,6],r:20,th:-.6,ph:1.25,link:''},
 {n:'Hội quán Phúc Kiến',t:'Hội quán của cộng đồng người Hoa, nổi bật với cổng tam quan và mái ngói trang trí cầu kỳ.',pos:[-24,3,26],r:17,th:.35,ph:1.25,link:''},
 {n:'Phố đèn lồng',t:'Hàng nghìn chiếc đèn lồng thắp sáng phố cổ vào đêm rằm (14 âm lịch hằng tháng; từ năm 1998 phố cổ tắt điện và dành cho người đi bộ), trở thành nét riêng của Hội An.',pos:[8,4,7],r:17,th:-.35,ph:1.05,link:''}]},
{id:'hue',name:'Quần thể Cố đô Huế',city:'Huế',prov:'Huế',reg:'Trung',type:'thanh',year:'1805',yn:1805,unesco:'Di sản thế giới 1993',ll:[16.4698,107.5786],bg:0xa8b3a5,
 text:'Kinh đô của nhà Nguyễn (1802–1945). Kinh thành Huế được khởi công năm 1805. UNESCO ghi danh năm 1993.',
 link:'https://vi.wikipedia.org/wiki/Quần_thể_di_tích_Cố_đô_Huế',cam:[0,3,0,60,.5,1.1],
 spots:[{n:'Kỳ Đài',t:'Cột cờ trước Ngọ Môn, dựng năm 1807 cùng thời gian xây Kinh thành. Cột cờ được thay nhiều lần; cột bê tông hiện nay xây năm 1948, cao khoảng 37 m.',y:'1807',pos:[0,5,34],r:26,th:.3,ph:1.2,link:'https://vi.wikipedia.org/wiki/Kỳ_đài_(Huế)'},
 {n:'Ngọ Môn',t:'Cổng chính phía Nam Hoàng thành, xây năm 1833 dưới thời Minh Mạng trên nền Nam Khuyết đài cũ; lầu Ngũ Phụng phía trên là nơi vua ban chiếu, lễ ban sóc.',y:'1833',pos:[0,3,20],r:28,th:.45,ph:1.25,link:'https://vi.wikipedia.org/wiki/Ngọ_Môn_(Hoàng_thành_Huế)'},
 {n:'Điện Thái Hòa',t:'Điện thiết triều của nhà Nguyễn, nơi diễn ra lễ đăng quang và các đại lễ. Khởi công năm 1805, được Minh Mạng cho xây lại ở vị trí hiện nay năm 1833; điện có hệ thống cột son thếp vàng rất đặc sắc.',y:'1805 · 1833',pos:[0,3,-2],r:26,th:1.15,ph:1.15,link:'https://vi.wikipedia.org/wiki/Điện_Thái_Hòa_(Hoàng_thành_Huế)'},
 {n:'Cửu Đỉnh',t:'Chín đỉnh đồng do vua Minh Mạng cho đúc từ năm 1835, hoàn thành năm 1837; mỗi đỉnh mang tên một vị vua nhà Nguyễn và khắc hình cảnh vật, sản vật của đất nước. Chúng đặt trong sân Thế Miếu, trước Hiển Lâm Các.',y:'1835–1837',pos:[14,2,-14],r:16,th:-.5,ph:1.2,link:'https://vi.wikipedia.org/wiki/Cửu_Đỉnh_(Nhà_Nguyễn)'}]},
{id:'duc-ba',name:'Nhà thờ Đức Bà & Bưu điện Sài Gòn',city:'TP. Hồ Chí Minh',prov:'TP. Hồ Chí Minh',reg:'Nam',type:'pho',year:'1877–1880',yn:1877,unesco:'',ll:[10.7798,106.699],bg:0xb5bcbf,
 text:'Cụm kiến trúc thời Pháp thuộc ở trung tâm Sài Gòn. Nhà thờ Đức Bà xây năm 1877–1880 với gạch, ngói, kính màu nhập từ Pháp; Bưu điện Trung tâm xây giai đoạn 1886–1891 ở ngay bên cạnh, quanh Công trường Công xã Paris.',
 link:'https://vi.wikipedia.org/wiki/Nhà_thờ_chính_tòa_Đức_Bà_Sài_Gòn',cam:[14,5,-10,80,.22,1.1],

  'Truyền thuyết nỏ thần và chuyện Mỵ Châu – Trọng Thủy phản ánh cuộc chiến giữ nước của Âu Lạc trước Triệu Đà; khảo cổ cũng tìm thấy lò đúc và khuôn đúc mũi tên đồng ba cạnh ở khu vực này. Năm 939 Ngô Quyền xưng vương và chọn Cổ Loa làm kinh đô.'],
 tl:[['Thế kỷ III TCN','An Dương Vương lập nước Âu Lạc và đóng đô ở Cổ Loa.'],
  ['Truyền thuyết','Thần Kim Quy giúp xây thành; Cao Lỗ chế tạo nỏ thần; Triệu Đà dùng kế hôn nhân Trọng Thủy – Mỵ Châu để chiếm Âu Lạc.'],
  ['939','Ngô Quyền xưng vương, đóng đô ở Cổ Loa.'],
  ['2012','Khu di tích Cổ Loa được công nhận là Di tích quốc gia đặc biệt.'],
  ['Hiện nay','Hồ sơ đề cử UNESCO ghi danh Cổ Loa là Di sản thế giới đang được chuẩn bị.']],
 v:'Cổ Loa cho thấy trình độ tổ chức xã hội, quân sự và kỹ thuật đắp thành của người Việt cổ, đồng thời lưu giữ nhiều truyền thuyết quen thuộc của dân tộc.',
 more:[['An Dương Vương (Thục Phán)','https://vi.wikipedia.org/wiki/Thục_Phán'],['Nỏ liên châu','https://vi.wikipedia.org/wiki/Nỏ_liên_châu'],['Thành Cổ Loa (Báo Nhân Dân)','https://nhandan.vn/thanh-co-loa-post949138.html'],['Cổ Loa – thành cổ và truyền thuyết','https://tuoitre.vn/co-loa---thanh-co-va-truyen-thuyet-341414.htm'],['Chuẩn bị hồ sơ trình UNESCO ghi danh Cổ Loa là Di sản thế giới','https://tuoitre.vn/chuan-bi-ho-so-trinh-unesco-ghi-danh-co-loa-la-di-san-the-gioi-100260812213306878.htm']]},
'my-son':{wp:['vi:Thánh địa Mỹ Sơn','en:Mỹ Sơn','en:My Son'],kw:['my son'],
 p:['Mỹ Sơn là quần thể đền tháp của vương quốc Chăm Pa, nằm trong một thung lũng có núi bao quanh ở vùng Duy Xuyên (nay thuộc Đà Nẵng, trước đây là Quảng Nam). Các vua Chăm xây dựng và tu bổ nơi đây liên tục từ thế kỷ IV đến thế kỷ XIII, chủ yếu để thờ thần Shiva và tôn vinh các vị vua được tôn xưng như thần.',
  'Theo bia ký, vua Bhadravarman (trị vì khoảng cuối thế kỷ IV) cho dựng điện thờ linga thần Shiva đầu tiên ở đây; ngôi đền gỗ ấy về sau bị cháy và được xây lại dưới thời vua Sambhuvarman (trị vì khoảng 572–629). Các đền tháp sau này được xây bằng gạch nung với nhiều họa tiết tinh xảo.',
  'Mỹ Sơn từng có hơn 70 công trình; đến năm 1975 chỉ còn khoảng 32 công trình, nhiều công trình bị bom Mỹ phá hủy năm 1969, kể cả tháp chính A1 cao khoảng 24 m. Năm 1999 UNESCO ghi danh Mỹ Sơn là Di sản văn hóa thế giới; hiện nơi đây được bảo tồn cùng các chuyên gia quốc tế (Ấn Độ, Ý, Ba Lan…) và đang được số hóa dữ liệu.'],
 tl:[['Cuối thế kỷ IV','Vua Bhadravarman dựng điện thờ thần Shiva đầu tiên ở Mỹ Sơn.'],['Thế kỷ VI – VII','Vua Sambhuvarman xây lại ngôi đền sau hỏa hoạn.'],['Thế kỷ X – XI','Nhiều công trình đẹp nhất ra đời; phong cách kiến trúc “Mỹ Sơn A1” hình thành.'],['Thế kỷ XIII','Giai đoạn xây dựng cuối cùng tại thánh địa.'],['1969','Bom Mỹ phá hủy nhóm tháp A, trong đó có tháp A1.'],['1999','UNESCO ghi danh Di sản văn hóa thế giới.']],
 v:'Mỹ Sơn là minh chứng tiêu biểu cho nền văn minh Chăm Pa và sự giao thoa văn hóa Ấn Độ – Đông Nam Á; kỹ thuật xây gạch của người Chăm vẫn là đề tài nghiên cứu của nhiều nhà khoa học.',
 more:[['Lịch sử Chăm Pa','https://vi.wikipedia.org/wiki/Lịch_sử_Chăm_Pa'],['My Son Sanctuary (UNESCO)','https://whc.unesco.org/en/list/949/'],['Khám phá di sản văn hóa thế giới Mỹ Sơn','https://www.vietnamplus.vn/kham-pha-di-san-van-hoa-the-gioi-my-son-quan-the-den-dai-champa-co-post780554.vnp'],['Mỹ Sơn – khu di tích tôn giáo kỳ vĩ nhất','https://nhandan.vn/my-son-khu-di-tich-ton-giao-ky-vi-nhat-post855304.html'],['Gìn giữ Mỹ Sơn bằng dữ liệu số','https://baovanhoa.vn/nhip-song-so/gin-giu-my-son-bang-du-lieu-so-272568.html']]},
'hoa-lu':{wp:['vi:Cố đô Hoa Lư','en:Hoa Lư','vi:Quần thể danh thắng Tràng An'],kw:['hoa lu','trang an','ninh binh'],
 p:['Hoa Lư là kinh đô đầu tiên của nhà nước Đại Cồ Việt. Năm 968, sau khi dẹp loạn 12 sứ quân, Đinh Bộ Lĩnh lên ngôi hoàng đế (Đinh Tiên Hoàng), đặt quốc hiệu Đại Cồ Việt, niên hiệu Thái Bình và định đô ở Hoa Lư.',
  'Kinh đô tồn tại khoảng 42 năm với ba triều đại: nhà Đinh (968–980), Tiền Lê (980–1009) và những tháng đầu nhà Lý. Núi đá vôi bao quanh tạo thành lũy tự nhiên; kinh thành gồm hai khu Thành Đông và Thành Tây. Dưới thời Lê Đại Hành, quân dân Đại Cồ Việt đánh bại cuộc xâm lược của nhà Tống năm 981.',
  'Năm 1010, Lý Thái Tổ (Lý Công Uẩn) ban Chiếu dời đô, chuyển kinh đô ra Đại La và đổi tên là Thăng Long. Hoa Lư nằm trong Quần thể danh thắng Tràng An – di sản thế giới hỗn hợp (văn hóa và thiên nhiên) được UNESCO ghi danh năm 2014. Nơi đây còn đền vua Đinh, đền vua Lê và chùa Nhất Trụ với cột kinh đá thế kỷ X.'],
 tl:[['968','Đinh Bộ Lĩnh lên ngôi, quốc hiệu Đại Cồ Việt, định đô Hoa Lư.'],['980','Lê Hoàn lên ngôi, lập nhà Tiền Lê, tiếp tục đóng đô ở Hoa Lư.'],['981','Lê Đại Hành đánh bại quân Tống xâm lược.'],['1010','Lý Thái Tổ dời đô từ Hoa Lư ra Thăng Long.'],['2014','Quần thể danh thắng Tràng An (có Cố đô Hoa Lư) được UNESCO ghi danh là di sản thế giới hỗn hợp.']],
 v:'Hoa Lư đánh dấu bước đầu xây dựng nhà nước trung ương tập quyền độc lập, tự chủ sau hơn một nghìn năm Bắc thuộc.',
 more:[['Quần thể di tích thờ Vua Đinh ở Ninh Bình','https://vi.wikipedia.org/wiki/Quần_thể_di_tích_thờ_Vua_Đinh_ở_Ninh_Bình'],['Trang An Landscape Complex (UNESCO)','https://whc.unesco.org/en/list/1438'],['Bảo tồn, phát huy giá trị lịch sử kinh đô Hoa Lư','https://nhandan.vn/bao-ton-phat-huy-gia-tri-lich-su-kinh-do-hoa-lu-post683505.html'],['Kỷ niệm 1050 năm Nhà nước Đại Cồ Việt','https://baovanhoa.vn/chinh-tri/ky-niem-1050-nam-nha-nuoc-dai-co-viet-hoi-tu-y-chi-tu-luc-tu-cuong-long-tu-ton-dan-toc-882.html'],['Nhà nước Đại Cồ Việt: kết tinh ý chí tự lực, tự cường','https://www.sggp.org.vn/nha-nuoc-dai-co-viet-ket-tinh-hoi-tu-cua-y-chi-tu-luc-tu-cuong-cua-hon-thieng-song-nui-post475723.html']]},
'thang-long':{wp:['vi:Hoàng thành Thăng Long','en:Imperial Citadel of Thăng Long'],kw:['thang long','hanoi','ha noi','hoang thanh'],sp:[null,null,null,null,[]],
 p:['Năm 1010, vua Lý Thái Tổ dời đô từ Hoa Lư ra thành Đại La và đổi tên thành Thăng Long. Từ đó Thăng Long là trung tâm quyền lực của nhiều triều đại – Lý, Trần, Lê sơ, Mạc, Lê trung hưng; đến thời Nguyễn kinh đô chuyển vào Huế và Thăng Long trở thành thành Hà Nội.',
  'Khu trung tâm Hoàng thành Thăng Long – Hà Nội được UNESCO ghi danh Di sản văn hóa thế giới năm 2010, đúng dịp kỷ niệm 1000 năm Thăng Long – Hà Nội. Khu di sản gồm Khu thành cổ (Đoan Môn, điện Kính Thiên, Hậu Lâu, Bắc Môn…) và Khu khảo cổ học số 18 Hoàng Diệu.',
  'Cuộc khai quật bắt đầu từ năm 2002, khi xây dựng Nhà Quốc hội, đã làm lộ nhiều tầng văn hóa chồng lên nhau – từ thành Đại La thời Đường đến các cung điện Lý, Trần, Lê và thành Hà Nội thế kỷ XIX – cho thấy sự tiếp nối liên tục của một trung tâm quyền lực suốt hơn 13 thế kỷ.'],
 tl:[['1010','Lý Thái Tổ dời đô ra Thăng Long.'],['1428','Lê Thái Tổ cho xây điện Kính Thiên (theo Đại Việt sử ký toàn thư).'],['1805–1812','Xây dựng Cột cờ Hà Nội dưới thời Nguyễn.'],['1886','Thực dân Pháp phá hủy điện Kính Thiên để xây nhà chỉ huy pháo binh.'],['2002','Khai quật khu 18 Hoàng Diệu làm lộ nhiều tầng di tích.'],['2010','UNESCO ghi danh Khu trung tâm Hoàng thành Thăng Long – Hà Nội.']],
 v:'Hoàng thành là chứng tích về sự tiếp nối liên tục của một trung tâm quyền lực suốt hơn 13 thế kỷ, từ Đại La đến Hà Nội ngày nay.',
 more:[['Thăng Long','https://vi.wikipedia.org/wiki/Thăng_Long'],['Imperial Citadel of Thang Long – Hanoi (UNESCO)','https://whc.unesco.org/en/list/1328/'],['Hoàng thành Thăng Long – nơi hội tụ các giá trị lịch sử, văn hóa của dân tộc','https://special.nhandan.vn/hoang-thanh-Thang-Long/index.html'],['Tìm thấy mộc bản khắc Chiếu dời đô cổ nhất','https://vnexpress.net/tim-thay-moc-ban-khac-chieu-doi-do-co-nhat-2174178.html']]},
'van-mieu':{wp:['vi:Văn Miếu – Quốc Tử Giám','en:Temple of Literature, Hanoi'],kw:['van mieu','temple of literature','quoc tu giam'],sp:[null,['vi:Khuê Văn Các','en:Khuê Văn Các'],null,null,null],
 p:['Văn Miếu được xây dựng năm 1070 dưới thời vua Lý Thánh Tông để thờ Khổng Tử, Chu Công và các bậc hiền triết Nho giáo. Năm 1076, vua Lý Nhân Tông lập Quốc Tử Giám ngay bên cạnh – được coi là trường đại học đầu tiên của Việt Nam, ban đầu dành cho con vua và quý tộc.',
  'Khu di tích có năm lớp không gian nối nhau trên một trục: Văn Miếu Môn, Đại Trung Môn, Khuê Văn Các, Đại Thành Môn và nhà Thái Học. Giếng Thiên Quang hình vuông nằm giữa sân Khuê Văn Các; hai bên là 82 bia đá đặt trên lưng rùa ghi tên các tiến sĩ.',
  '82 bia tiến sĩ ghi danh những người đỗ trong các khoa thi từ 1442 đến 1779, được dựng từ năm 1484 đến 1780. Bộ bia được UNESCO ghi vào Danh mục Ký ức thế giới (di sản tư liệu) năm 2011. Khuê Văn Các, dựng năm 1805, là biểu tượng của Thủ đô Hà Nội.'],
 tl:[['1070','Lập Văn Miếu thờ Khổng Tử (vua Lý Thánh Tông).'],['1076','Lập Quốc Tử Giám, trường đại học đầu tiên của Việt Nam (vua Lý Nhân Tông).'],['1484 – 1780','Dựng 82 bia tiến sĩ ghi danh các khoa thi 1442 – 1779.'],['1805','Dựng Khuê Văn Các.'],['2011','Bia tiến sĩ được ghi vào Danh mục Ký ức thế giới của UNESCO.']],
 v:'Văn Miếu – Quốc Tử Giám thể hiện truyền thống hiếu học, trọng người tài của dân tộc; ngày nay vẫn có rất nhiều học sinh, sinh viên đến thăm, nhất là trước các kỳ thi.',
 more:[['Bia tiến sĩ Văn Miếu Thăng Long','https://vi.wikipedia.org/wiki/Bia_tiến_sĩ_Văn_Miếu_Thăng_Long'],['Stone stele records of royal examinations of the Lê and Mạc dynasties (UNESCO)','https://www.unesco.org/en/memory-world/stone-stele-records-royal-examinations-le-and-mac-dynasties-1442-1779'],['Bia tiến sĩ tại Văn Miếu – Quốc Tử Giám là Di sản tư liệu thế giới','https://tuoitre.vn/bia-tien-si-tai-van-mieu---quoc-tu-giam-la-di-san-tu-lieu-the-gioi-367388.htm'],['Pho sử quý bằng đá “kể chuyện” khoa cử ngàn năm','https://baophapluat.vn/pho-su-quy-bang-da-ke-chuyen-khoa-cu-ngan-nam.html']]},
'thanh-nha-ho':{wp:['vi:Thành nhà Hồ','en:Citadel of the Hồ Dynasty'],kw:['nha ho','ho dynasty','tay do','thanh hoa'],
 p:['Thành nhà Hồ (còn gọi là thành Tây Đô) ở Vĩnh Lộc, Thanh Hóa, do Hồ Quý Ly cho xây năm 1397 chỉ trong khoảng ba tháng. Năm 1400, Hồ Quý Ly lập nhà Hồ, đặt quốc hiệu Đại Ngu và thành trở thành kinh đô.',
  'Điểm đặc sắc của thành là tường và cổng xây bằng những khối đá lớn đẽo vuông, xếp khít chồng lên nhau, nhiều khối nặng hàng chục tấn, đứng vững hơn sáu thế kỷ. Hoàng thành hình gần vuông, mỗi cạnh gần 900 m, có bốn cổng; cổng Nam lớn nhất với ba cửa vòm.',
  'Nhà Hồ chỉ tồn tại từ 1400 đến 1407 trước cuộc xâm lược của nhà Minh. Thành nhà Hồ được UNESCO ghi danh Di sản văn hóa thế giới năm 2011 như một tòa thành đá hiếm có ở Đông Nam Á; khảo cổ vẫn đang phát lộ nền điện Hoàng Nguyên, đường Hoàng Gia và Đàn tế Nam Giao.'],
 tl:[['1397','Hồ Quý Ly cho xây thành Tây Đô trong khoảng ba tháng.'],['1400','Hồ Quý Ly lập nhà Hồ, đặt quốc hiệu Đại Ngu; thành là kinh đô.'],['1402','Làm đường Hoàng Gia nối thành với Đàn tế Nam Giao.'],['1407','Nhà Hồ sụp đổ trước cuộc xâm lược của nhà Minh.'],['2011','UNESCO ghi danh Di sản văn hóa thế giới.']],
 v:'Thành nhà Hồ cho thấy trình độ kỹ thuật xây dựng bằng đá và ý chí cải cách của Hồ Quý Ly vào cuối thế kỷ XIV.',
 more:[['Citadel of the Ho Dynasty (UNESCO)','https://whc.unesco.org/en/list/1358/'],['Thành Nhà Hồ – Di sản văn hóa thế giới giữa lòng xứ Thanh','https://www.sggp.org.vn/thanh-nha-ho-di-san-van-hoa-the-gioi-giua-long-xu-thanh-post714067.html'],['Khảo cổ học tại Di sản thế giới Thành nhà Hồ','https://baovanhoa.vn/van-hoa/bai-cuoi-nen-tang-khoa-hoc-cho-bao-ton-va-phat-huy-gia-tri-toan-cau-135447.html'],['Về với di sản xứ Thanh','https://nhandan.vn/ve-voi-di-san-xu-thanh-post921888.html']]},
'hoi-an':{wp:['vi:Phố cổ Hội An','en:Hội An'],kw:['hoi an'],sp:[null,[],['vi:Hội quán Phúc Kiến (Hội An)','en:Phuc Kien Assembly Hall'],[]],
 p:['Hội An (nay thuộc Đà Nẵng, trước đây là Quảng Nam) là thương cảng quốc tế sầm uất vào thế kỷ XVI–XVII, nơi thương nhân Việt, Hoa, Nhật và phương Tây gặp gỡ. Sang thế kỷ XIX cảng suy dần khi cửa sông bị bồi cạn và Đà Nẵng phát triển, nhờ đó phố cổ được giữ gần như nguyên vẹn.',
  'Phố cổ có những ngôi nhà ống gỗ mái ngói âm dương, các hội quán của người Hoa (như Phúc Kiến, Quảng Triệu) và Chùa Cầu – cây cầu mái ngói do cộng đồng thương nhân Nhật góp công xây vào thế kỷ XVII; năm 1719 chúa Nguyễn Phúc Chu đặt tên cầu là Lai Viễn Kiều (cầu đón khách phương xa).',
  'Hội An được UNESCO ghi danh Di sản văn hóa thế giới năm 1999. Từ năm 1998, vào đêm 14 âm lịch hằng tháng, phố cổ tắt điện, thắp đèn lồng và cấm xe cơ giới để người dân và du khách đi bộ dưới ánh trăng.'],
 tl:[['Thế kỷ XVI – XVII','Hội An là thương cảng quốc tế; thương nhân Nhật, Hoa lập khu cư trú và hội quán.'],['1719','Chúa Nguyễn Phúc Chu đặt tên cầu là Lai Viễn Kiều.'],['1792','Hội quán Phúc Kiến (trên nền ngôi chùa cũ) được đổi thành hội quán của người Hoa Phúc Kiến.'],['1998','Bắt đầu tổ chức đêm rằm phố cổ: tắt điện, thắp đèn lồng.'],['1999','UNESCO ghi danh Di sản văn hóa thế giới.']],
 v:'Hội An là ví dụ tiêu biểu về một thương cảng truyền thống Đông Nam Á được bảo tồn tốt, nơi các nền văn hóa Việt – Hoa – Nhật giao thoa.',
 more:[['Chùa Cầu','https://vi.wikipedia.org/wiki/Chùa_Cầu'],['Hội An Ancient Town (UNESCO)','https://whc.unesco.org/en/list/948/'],['Thăm Chùa Cầu, linh hồn phố cổ Hội An','https://baophapluat.vn/tham-chua-cau-linh-hon-pho-co-hoi-an-post191160.html']]},
'hue':{wp:['vi:Quần thể di tích Cố đô Huế','en:Complex of Huế Monuments'],kw:['hue'],
 p:['Huế là kinh đô của nước Việt Nam thống nhất dưới triều Nguyễn, với 13 đời vua từ năm 1802 đến 1945. Kinh thành Huế khởi công năm 1805 thời vua Gia Long và tiếp tục được hoàn thiện dưới thời Minh Mạng; bên trong là Hoàng thành và Tử Cấm Thành (Đại Nội).',
  'Quần thể di tích gồm Kinh thành, Hoàng thành, các lăng tẩm của vua Nguyễn (như Gia Long, Minh Mạng, Khải Định), chùa Thiên Mụ… hòa với cảnh quan sông Hương, núi Ngự Bình. Ngọ Môn – cổng chính phía Nam Hoàng thành – xây năm 1833; điện Thái Hòa là nơi tổ chức lễ đăng quang và các đại lễ.',
  'Ngày 30/8/1945, vua Bảo Đại thoái vị tại Ngọ Môn, chấm dứt chế độ quân chủ. Quần thể di tích Cố đô Huế được UNESCO ghi danh năm 1993 – di sản thế giới đầu tiên của Việt Nam; Nhã nhạc cung đình Huế được UNESCO ghi danh năm 2003.'],
 tl:[['1802','Nguyễn Ánh lên ngôi (vua Gia Long), chọn Huế làm kinh đô.'],['1805','Khởi công xây Kinh thành Huế.'],['1833','Minh Mạng cho xây Ngọ Môn và xây lại điện Thái Hòa ở vị trí hiện nay.'],['1835 – 1837','Đúc Cửu Đỉnh.'],['30/8/1945','Vua Bảo Đại thoái vị, chấm dứt triều Nguyễn.'],['1993','UNESCO ghi danh Quần thể di tích Cố đô Huế.']],
 v:'Huế còn giữ được diện mạo của một kinh đô phong kiến phương Đông cùng kho tàng di sản phi vật thể như Nhã nhạc cung đình.',
 more:[['Complex of Hué Monuments (UNESCO)','https://whc.unesco.org/en/list/678/'],['Di sản Cố đô – trao truyền và hội tụ','https://baovanhoa.vn/di-san/di-san-co-do-trao-truyen-va-hoi-tu-3748.html']]},
'duc-ba':{wp:['vi:Nhà thờ chính tòa Đức Bà Sài Gòn','en:Saigon Notre-Dame Basilica'],kw:['duc ba','notre','sai gon','saigon'],sp:[['vi:Nhà thờ chính tòa Đức Bà Sài Gòn','en:Saigon Notre-Dame Basilica'],null,null,['vi:Công trường Công xã Paris']],
 p:['Nhà thờ Đức Bà (Nhà thờ chính tòa Đức Bà Sài Gòn) do kiến trúc sư người Pháp J. Bourard thiết kế theo phong cách Roman. Viên đá đầu tiên được đặt ngày 7/10/1877; lễ cung hiến ngày 11/4/1880. Gạch, ngói, sắt thép được vận chuyển từ Pháp sang; năm 1895 hai tháp chuông được thêm mái chóp, cao khoảng 58 m.',
  'Ngay bên cạnh là Bưu điện Trung tâm Sài Gòn, xây giai đoạn 1886–1891 theo phong cách chiết trung; các nguồn thường nêu tên các kiến trúc sư người Pháp Villedieu và Foulhoux. Sảnh chính có mái vòm sắt kính gợi nhà ga, và bưu điện vẫn hoạt động đến ngày nay.',
  'Công trường Công xã Paris – nơi hai công trình đối diện nhau – từng được gọi là công trường Nhà thờ, rồi công trường Hòa Bình; tượng Đức Mẹ Hòa Bình được đặt năm 1959. Sau năm 1975, tên gọi hiện nay gắn với Công xã Paris năm 1871.'],
 tl:[['1877','Đặt viên đá đầu tiên xây nhà thờ (7/10/1877).'],['1880','Lễ cung hiến nhà thờ (11/4/1880).'],['1886 – 1891','Xây dựng Bưu điện Trung tâm Sài Gòn.'],['1895','Thêm mái chóp cho hai tháp chuông.'],['1959','Đặt tượng Đức Mẹ Hòa Bình trước nhà thờ.']],
 v:'Cụm kiến trúc Pháp này là điểm hẹn quen thuộc của người Sài Gòn và là chứng tích của giai đoạn Pháp thuộc trong diện mạo đô thị của thành phố.',
 more:[['Công trường Công xã Paris','https://vi.wikipedia.org/wiki/Công_trường_Công_xã_Paris'],['Charming French architecture in Saigon (VNA)','https://vietnam.vnanet.vn/english/tin-tuc/charming-french-architecture-in-saigon-206961.html'],['Những kiến trúc Pháp tuyệt đẹp của Sài Gòn','https://znews.vn/nhung-kien-truc-phap-tuyet-dep-cua-sai-gon-post543558.html']]},
'ba-dinh':{wp:['vi:Lăng Chủ tịch Hồ Chí Minh','en:Ho Chi Minh Mausoleum','vi:Quảng trường Ba Đình'],kw:['ba dinh','ho chi minh','mausoleum'],sp:[['vi:Quảng trường Ba Đình','en:Ba Đình Square'],null,['vi:Chùa Một Cột','en:One Pillar Pagoda'],['vi:Nhà sàn Bác Hồ',`en:Ho Chi Minh's Stilt House`],['vi:Phủ Chủ tịch','vi:Khu di tích Phủ Chủ tịch']],
 p:['Quảng trường Ba Đình là nơi ngày 2/9/1945 Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa. Tên “Ba Đình” gợi nhớ cuộc khởi nghĩa Ba Đình (Thanh Hóa); trước đó nơi này là vườn hoa Puginier.',
  'Lăng Chủ tịch Hồ Chí Minh khởi công ngày 2/9/1973, khánh thành ngày 29/8/1975, được xây trên vị trí lễ đài cũ của quảng trường, là kết quả của sự hợp tác Việt Nam – Liên Xô. Khu vực xung quanh còn có Chùa Một Cột (dựng năm 1049), Bảo tàng Hồ Chí Minh (thành lập năm 1990) và Khu di tích Phủ Chủ tịch với nhà sàn Bác Hồ.',
  'Khu di tích Chủ tịch Hồ Chí Minh tại Phủ Chủ tịch là Di tích quốc gia đặc biệt. Nhà sàn gỗ được xây năm 1958, nơi Bác ở và làm việc từ tháng 5/1958 cho đến khi qua đời năm 1969.'],
 tl:[['1049','Vua Lý Thái Tông cho dựng chùa Một Cột (chùa Diên Hựu).'],['2/9/1945','Tuyên ngôn Độc lập được đọc tại Quảng trường Ba Đình.'],['1958','Xây nhà sàn trong khu Phủ Chủ tịch.'],['1973 – 1975','Xây dựng Lăng Chủ tịch Hồ Chí Minh (khánh thành 29/8/1975).'],['1990','Thành lập Bảo tàng Hồ Chí Minh.']],
 v:'Ba Đình là trung tâm chính trị – lịch sử của đất nước và là nơi nhiều người đến tưởng niệm Chủ tịch Hồ Chí Minh.',
 more:[['Quảng trường Ba Đình','https://vi.wikipedia.org/wiki/Quảng_trường_Ba_Đình'],['Khu di tích Phủ Chủ tịch','https://vi.wikipedia.org/wiki/Khu_di_tích_Phủ_Chủ_tịch'],['Bảo tàng Hồ Chí Minh','https://vi.wikipedia.org/wiki/Bảo_tàng_Hồ_Chí_Minh'],['Chùa Một Cột','https://vi.wikipedia.org/wiki/Chùa_Một_Cột']]},
'cu-chi':{wp:['vi:Địa đạo Củ Chi',`en:Củ Chi tunnels`,'en:Cu Chi tunnels'],kw:['cu chi'],sp:[null,null,null,[]],
 p:['Địa đạo Củ Chi là hệ thống đường hầm ngầm nhiều tầng ở phía tây bắc Sài Gòn. Những đoạn hầm sớm nhất xuất hiện từ khoảng năm 1948 trong kháng chiến chống Pháp, sau đó được nối thông và mở rộng thành mạng lưới dài hàng trăm kilômét trong kháng chiến chống Mỹ.',
  'Hầm chia thành ba tầng sâu khoảng 3 m, 6 m và 12 m, có hầm chỉ huy, bệnh xá, kho, bếp Hoàng Cầm không khói và những cửa hầm ngụy trang kín đáo. Hai khu di tích được bảo tồn để tham quan là Bến Dược (căn cứ Khu ủy) và Bến Đình (căn cứ Huyện ủy Củ Chi).',
  'Tổng chiều dài thường được nêu khoảng 250 km (một số nguồn nêu trên 200 km). Bến Dược được xếp hạng di tích lịch sử – văn hóa quốc gia năm 1979, Bến Đình năm 2004.'],
 tl:[['1948','Những đoạn địa đạo đầu tiên được đào ở Củ Chi.'],['Thập niên 1960','Địa đạo được nối thông, mở rộng nhiều tầng trong kháng chiến chống Mỹ.'],['1979','Bến Dược được xếp hạng di tích lịch sử – văn hóa quốc gia.'],['2004','Bến Đình được xếp hạng di tích lịch sử quốc gia.']],
 v:'Địa đạo Củ Chi là biểu tượng của sức mạnh chiến tranh nhân dân và tinh thần bám đất, bám dân của quân dân Củ Chi.',
 more:[['Địa đạo Củ Chi – kỳ tích anh hùng','https://special.nhandan.vn/dia-dao-Cu-Chi-ky-tich-anh-hung/index.html'],['Kỳ tích Củ Chi','https://baophapluat.vn/ky-tich-cu-chi-post329504.html'],['Về huyền thoại Địa đạo Củ Chi','https://baoquocte.vn/ve-huyen-thoai-dia-dao-cu-chi-310202.html']]},
'dien-bien':{wp:['vi:Khu di tích chiến trường Điện Biên Phủ','vi:Chiến dịch Điện Biên Phủ','en:Battle of Dien Bien Phu'],kw:['dien bien'],
 p:['Chiến dịch Điện Biên Phủ diễn ra 56 ngày đêm, từ 13/3 đến 7/5/1954, giữa Quân đội nhân dân Việt Nam do Đại tướng Võ Nguyên Giáp chỉ huy và tập đoàn cứ điểm của quân Pháp ở lòng chảo Mường Thanh (Điện Biên). Lệnh nổ súng được ban ra lúc 17 giờ 30 ngày 13/3/1954.',
  'Quân ta đánh theo ba đợt, lần lượt cô lập và tiêu diệt từng cứ điểm. Trận đồi A1 (Eliane 2) là trận ác liệt nhất; chiều 7/5/1954 tướng De Castries cùng toàn bộ Bộ tham mưu tập đoàn cứ điểm bị bắt sống. Phía Pháp bị tiêu diệt và bắt sống khoảng 16.200 người.',
  'Thắng lợi tạo thế mạnh cho phái đoàn Việt Nam tại Hội nghị Genève (khai mạc ngày 8/5/1954); Hiệp định Genève được ký ngày 21/7/1954, chấm dứt chiến tranh ở Đông Dương. Khu di tích chiến trường nay có đồi A1, hầm De Castries, cầu Mường Thanh và Tượng đài Chiến thắng trên đồi D1 (khánh thành năm 2004).'],
 tl:[['13/3/1954','17 giờ 30: nổ súng mở màn chiến dịch.'],['6/5/1954','Khối bộc phá khoảng một tấn nổ dưới đồi A1; quân ta làm chủ đồi trong đêm 6 và sáng 7/5.'],['7/5/1954','Tướng De Castries cùng bộ tham mưu bị bắt; chiến dịch kết thúc.'],['8/5/1954','Hội nghị Genève về Đông Dương khai mạc.'],['21/7/1954','Hiệp định Genève được ký.'],['2004','Khánh thành Tượng đài Chiến thắng Điện Biên Phủ trên đồi D1.']],
 v:'Điện Biên Phủ là chiến thắng có ý nghĩa lịch sử to lớn, góp phần kết thúc cuộc kháng chiến chống thực dân Pháp và cổ vũ phong trào giải phóng dân tộc trên thế giới.',
 more:[['Chiến dịch Điện Biên Phủ','https://vi.wikipedia.org/wiki/Chiến_dịch_Điện_Biên_Phủ'],['Điện Biên Phủ – chiến thắng của nghệ thuật quân sự Việt Nam','https://voh.com.vn/xa-hoi/dien-bien-phu-chien-thang-cua-nghe-thuat-quan-su-viet-nam-232684.html'],['Hình ảnh về Chiến thắng Điện Biên Phủ “lừng lẫy năm châu, chấn động địa cầu”','https://baolaocai.vn/hinh-anh-ve-chien-thang-dien-bien-phu-lung-lay-nam-chau-chan-dong-dia-cau-post356114.html'],['Hội nghị Geneva về Đông Dương (Báo Nhân Dân)','https://nhandan.vn/post-793539.html']]},
'dinh-doc-lap':{wp:['vi:Dinh Độc Lập','en:Independence Palace'],kw:['doc lap','independence','reunification','thong nhat'],sp:[['vi:Dinh Độc Lập','en:Independence Palace'],null,[],[]],
 p:['Dinh Độc Lập được xây trên nền Dinh Norodom thời Pháp thuộc. Ngày 27/2/1962, hai phi công Nguyễn Văn Cử và Phạm Phú Quốc ném bom làm hư hại nặng dinh cũ; sau đó chính quyền Việt Nam Cộng hòa quyết định xây dinh mới.',
  'Công trình do kiến trúc sư Ngô Viết Thụ – người Việt Nam đầu tiên đoạt giải Khôi nguyên La Mã – thiết kế; khởi công ngày 1/7/1962, khánh thành ngày 31/10/1966. Kiến trúc hiện đại pha tinh thần Á Đông, có hệ thống hầm kiên cố bên dưới.',
  'Trưa 30/4/1975, xe tăng của Quân giải phóng (trong đó có xe số hiệu 843 và 390) tiến vào Dinh; Tổng thống Dương Văn Minh tuyên bố đầu hàng vô điều kiện, đánh dấu thời khắc kết thúc chiến tranh. Từ đó nơi đây là Hội trường Thống Nhất, nay là di tích để tham quan.'],
 tl:[['Thế kỷ XIX','Dinh Norodom – dinh Toàn quyền Pháp – được xây dựng ở vị trí này.'],['27/2/1962','Dinh cũ bị máy bay ném bom.'],['1/7/1962','Khởi công xây dinh mới.'],['31/10/1966','Khánh thành Dinh Độc Lập.'],['30/4/1975','Xe tăng Quân giải phóng tiến vào Dinh; chính quyền Sài Gòn đầu hàng.']],
 v:'Dinh Độc Lập là chứng tích của thời khắc kết thúc chiến tranh, thống nhất đất nước vào ngày 30/4/1975.',
 more:[['Sự kiện 30 tháng 4 năm 1975','https://vi.wikipedia.org/wiki/Sự_kiện_30_tháng_4_năm_1975'],['Xe tăng húc đổ cổng Dinh Độc Lập hiện được để ở đâu?','https://znews.vn/xe-tang-huc-do-cong-dinh-doc-lap-hien-duoc-de-o-dau-post941242.html'],['Dinh Độc Lập mở cửa thêm 2 phòng cho khách tham quan','https://baophapluat.vn/dinh-doc-lap-mo-cua-them-2-phong-cho-khach-tham-quan-post215673.html'],['Dinh Độc Lập – giờ mở cửa và những gì cần xem','https://www.vietnamtourism.com/vi/dinh-oc-lap-o-tp-hcm-ve-gio-mo-cua-va-nhung-gi-can-xem']]},
'ha-long':{wp:['vi:Vịnh Hạ Long','en:Hạ Long Bay','en:Ha Long Bay'],kw:['ha long','halong'],sp:[null,['vi:Hòn Trống Mái','en:Trống Mái Islet'],null,[],null],
 p:['Vịnh Hạ Long ở Quảng Ninh nổi tiếng với hàng nghìn đảo đá vôi nhô lên từ mặt nước xanh ngọc. Tên “Hạ Long” nghĩa là “rồng xuống”, gắn với truyền thuyết rồng mẹ và đàn rồng con hạ xuống giúp người Việt đánh giặc, phun châu ngọc hóa thành các đảo đá.',
  'UNESCO ghi danh Vịnh Hạ Long lần đầu năm 1994 vì giá trị thẩm mỹ, rồi công nhận thêm giá trị địa chất – địa mạo năm 2000. Tháng 9/2023, tại kỳ họp lần thứ 45 ở Riyadh, di sản được mở rộng thành “Vịnh Hạ Long – Quần đảo Cát Bà”, di sản thế giới liên tỉnh đầu tiên của Việt Nam.',
  'Các nhà khảo cổ phát hiện khoảng 50 địa điểm của văn hóa Hạ Long (cách nay khoảng 3.000–5.000 năm) trên các đảo và ven biển; trong vịnh vẫn có các làng chài nổi như Cửa Vạn, Ba Hang, Cặp Dè. Nhiều hang động như Sửng Sốt, Đầu Gỗ, Thiên Cung được khai thác du lịch.'],
 tl:[['3.000 – 5.000 năm trước','Cư dân văn hóa Hạ Long sinh sống trên các đảo và ven biển.'],['1962','Chủ tịch Hồ Chí Minh cùng nhà du hành vũ trụ Gherman Titov thăm đảo; đảo được đặt tên Ti Tốp.'],['1994','UNESCO ghi danh lần đầu (giá trị thẩm mỹ).'],['2000','UNESCO công nhận thêm giá trị địa chất – địa mạo.'],['2023','Mở rộng thành Vịnh Hạ Long – Quần đảo Cát Bà.']],
 v:'Hạ Long vừa là thắng cảnh thiên nhiên có giá trị thẩm mỹ và địa chất nổi bật, vừa là nơi lưu giữ dấu vết văn hóa của con người hàng nghìn năm.',
 more:[['Văn hóa Hạ Long','https://vi.wikipedia.org/wiki/Văn_hóa_Hạ_Long'],['Ha Long Bay – Cat Ba Archipelago (UNESCO)','https://whc.unesco.org/en/list/672/'],['Vịnh Hạ Long – Quần đảo Cát Bà được UNESCO công nhận là Di sản Thiên nhiên Thế giới','https://baolaocai.vn/vinh-ha-long-quan-dao-cat-ba-duoc-unesco-cong-nhan-la-di-san-thien-nhien-the-gioi-post373653.html'],['Vịnh Hạ Long – quần đảo Cát Bà thành di sản thế giới UNESCO liên tỉnh','https://nhadautu.vn/vinh-ha-long--quan-dao-cat-ba-thanh-di-san-the-gioi-unesco-lien-tinh-d79875.html']]}

/* ===== TRANG "Ý NGHĨA & TIỀM NĂNG" – nội dung mặc định (người dùng có thể sửa và lưu ngay trên trang) ===== */
const ABOUT_DEF={
 title:'Ý nghĩa và tiềm năng của việc ứng dụng công nghệ số vào giới thiệu danh lam thắng cảnh',
 intro:'Trang web “Di sản Việt Nam 3D” là một thử nghiệm ứng dụng công nghệ số – mô hình 3D, bản đồ, dòng thời gian, ảnh tư liệu và câu hỏi tương tác – để đưa các di tích lịch sử, danh lam thắng cảnh của Việt Nam đến với người xem ngay trên màn hình điện thoại hoặc máy tính.',
 secs:[
  {h:'Ý nghĩa và tác dụng',b:'- Đi du lịch qua màn hình nhỏ: người xem có thể “đi” từ Đền Hùng đến Hạ Long, từ Huế vào Sài Gòn chỉ bằng vài lần chạm, xoay mô hình 3D, đọc thông tin và nghe thuyết minh mà không cần rời nhà.\n- Chi phí thấp: không tốn tiền đi lại, ăn ở, vé tham quan; chỉ cần một thiết bị có kết nối Internet. Học sinh, sinh viên có thể dùng ngay trong giờ học.\n- Tiếp cận rộng rãi: người ở vùng xa, người lớn tuổi, người khuyết tật hay người Việt ở nước ngoài đều có thể tìm hiểu di sản; thông tin xem được ở mọi thời điểm, không bị giới hạn giờ mở cửa hay mùa du lịch.\n- Giáo dục và truyền cảm hứng: kết hợp hình ảnh, mô hình, mốc thời gian và câu hỏi thử thách giúp ghi nhớ lịch sử dễ hơn, tạo hứng thú trước khi người xem tìm đến di tích thật.\n- Bảo tồn và lưu trữ: dữ liệu số giúp ghi lại hiện trạng di tích, giảm áp lực lượng khách lên những di tích mỏng manh và là nguồn tư liệu phục vụ công tác trùng tu về sau.'},
  {h:'Tiềm năng phát triển',b:'- Mô hình chi tiết và sát thực tế hơn: khi có thêm nhân lực và thời gian đầu tư, các mô hình khối đơn giản hiện nay có thể được thay bằng mô hình dựng từ ảnh chụp, quét 3D laser, ảnh 360° và máy bay không người lái, tái hiện đúng kiến trúc, màu sắc, hoa văn như thật.\n- Dữ liệu đa dạng hơn: bổ sung nhiều di tích, lễ hội, hiện vật, nhân vật lịch sử cùng tư liệu ảnh – video – âm thanh; có thể tổng hợp dữ liệu theo từng tỉnh, thành phố để hình thành kho dữ liệu di sản của cả nước.\n- Trải nghiệm phong phú hơn: tích hợp thực tế ảo (VR), thực tế tăng cường (AR) ngay tại di tích, thuyết minh đa ngôn ngữ, hướng dẫn viên ảo, bản đồ GIS và lớp bản đồ cổ.\n- Hợp tác: phối hợp với bảo tàng, ban quản lý di tích, nhà trường và cộng đồng địa phương để dữ liệu được kiểm chứng và cập nhật thường xuyên.'},
  {h:'Hạn chế hiện tại',b:'Các mô hình hiện chỉ mang tính minh họa, không thay thế tư liệu khoa học; thông tin được tổng hợp từ nguồn công khai (Wikipedia, UNESCO, báo chí) nên cần đối chiếu khi dùng cho mục đích học thuật. Trải nghiệm trực tuyến cũng không thể thay thế hoàn toàn cảm nhận khi đến tận nơi.'},
  {h:'Kết luận',b:'Ứng dụng công nghệ số không thay thế việc đến thăm di tích, mà là chiếc cầu nối giúp nhiều người biết đến, yêu mến và có ý thức gìn giữ di sản hơn.'}]};

function renderPlaces(){
 $('view').innerHTML=`<div class="wrap"><div class="eyebrow">Tham quan trực tuyến</div><h1>Đi qua <em>di sản</em><br>không cần rời nhà.</h1>

 <div class="tools"><input class="search" id="q" type="search" placeholder="Tìm địa điểm, tỉnh, thời kỳ…" aria-label="Tìm địa điểm" value="${esc(F.q)}"><span class="count" id="cnt"></span></div>

function grid(){const q=norm(F.q);

 if(tlFocus!==null){const el=$('view').querySelector(`.era[data-eid="${tlFocus}"]`);tlFocus=null;if(el)$('view').scrollTop=Math.max(0,el.getBoundingClientRect().top-$('view').getBoundingClientRect().top+$('view').scrollTop-100)}}

const mp=(lng,lat)=>[(lng-MP.L0)*MP.K*MP.S,(MP.T0-lat)*MP.S];
function clusterLabel(c){const n={};c.items.forEach(s=>n[s.prov]=(n[s.prov]||0)+1);const k=Object.keys(n).sort((a,b)=>n[b]-n[a]);return k.length<=2?k.join(' · '):k[0]+' & lân cận'}
function drawMap(){const el=$('mapBox');if(!el)return;const w=el.clientWidth||360,sc=w/MAP.W,R=15/sc,fs=11/sc;
 const cl=[];for(const s of SITES){const p=mp(s.ll[1],s.ll[0]);const c=cl.find(c=>Math.hypot(c.x-p[0],c.y-p[1])<2.1*R);
  if(c){c.items.push(s);c.x=(c.x*(c.items.length-1)+p[0])/c.items.length;c.y=(c.y*(c.items.length-1)+p[1])/c.items.length}else cl.push({x:p[0],y:p[1],items:[s]})}
 clusters=cl;
 /* đặt nhãn bên phải, trái, trên hoặc dưới điểm, chọn chỗ không chồng lên điểm/nhãn khác */
 const hit=(a,b)=>a.x0<b.x1&&a.x1>b.x0&&a.y0<b.y1&&a.y1>b.y0,placed=[];
 const dots=cl.map(c=>({c,x0:c.x-R,x1:c.x+R,y0:c.y-R,y1:c.y+R}));
 cl.forEach(c=>{c.lab=clusterLabel(c);const lw=c.lab.length*fs*.62+8/sc,g=R+4/sc,lh=fs*1.6;
  const opts=[{a:'start',x:R+6/sc,y:0,b:{x0:c.x+g,x1:c.x+g+lw,y0:c.y-lh/2,y1:c.y+lh/2}},
   {a:'end',x:-(R+6/sc),y:0,b:{x0:c.x-g-lw,x1:c.x-g,y0:c.y-lh/2,y1:c.y+lh/2}},
   {a:'middle',x:0,y:-(R+6/sc),b:{x0:c.x-lw/2,x1:c.x+lw/2,y0:c.y-g-lh,y1:c.y-g}},
   {a:'middle',x:0,y:R+fs+4/sc,b:{x0:c.x-lw/2,x1:c.x+lw/2,y0:c.y+g,y1:c.y+g+lh}}];
  const free=o=>o.b.x0>0&&o.b.x1<MAP.W&&o.b.y0>0&&o.b.y1<MAP.H&&!dots.some(d=>d.c!==c&&hit(o.b,d))&&!placed.some(q=>hit(o.b,q));
  c.pl=opts.find(free)||opts[0];placed.push(c.pl.b)});
 if(mapFocus){mapSel=cl.findIndex(c=>c.items.some(s=>s.id===mapFocus));mapFocus=null}
 if(mapSel>=cl.length)mapSel=-1;
 let g='';for(const la of[10,15,20]){const y=mp(0,la)[1];g+=`<line class="m-gl" x1="0" x2="${MAP.W}" y1="${y}" y2="${y}" vector-effect="non-scaling-stroke"/><text class="m-gt" x="${MAP.W-6}" y="${y-4}" text-anchor="end" font-size="${9/sc}">${la}°B</text>`}
 for(const lo of[105,110,115]){const x=mp(lo,0)[0];g+=`<line class="m-gl" y1="0" y2="${MAP.H}" x1="${x}" x2="${x}" vector-effect="non-scaling-stroke"/><text class="m-gt" x="${x+4}" y="${MAP.H-6}" font-size="${9/sc}">${lo}°Đ</text>`}
 const arch=(pts,lab,lx,ly)=>pts.map(q=>{const p=mp(q[0],q[1]);return `<circle class="m-ar" cx="${p[0]}" cy="${p[1]}" r="${1.5}"/>`}).join('')+`<text class="m-ar" x="${mp(lx,ly)[0]}" y="${mp(lx,ly)[1]}" text-anchor="middle" font-size="${fs*.95}">${lab}</text>`;
 const lab=(lng,lat,t,o=.28)=>{const p=mp(lng,lat);return `<text class="m-ct" x="${p[0]}" y="${p[1]}" text-anchor="middle" style="fill-opacity:${o+.04}" font-size="${fs*.85}" letter-spacing="${2/sc}">${t}</text>`};
 let mk='';cl.forEach((c,i)=>{const one=c.items.length===1,col=one?TYPES[c.items[0].type].c:'var(--gold)',on=i===mapSel;
  mk+=`<g class="mk" data-cl="${i}" tabindex="0" role="button" aria-label="${esc(clusterLabel(c))}: ${c.items.length} địa điểm" transform="translate(${c.x.toFixed(1)} ${c.y.toFixed(1)})" style="color:${col}"><circle r="${R*1.3}" fill="transparent"/>${on?`<circle class="sel" r="${R+4/sc}" stroke-width="${2/sc}"/>`:''}<circle class="ring" r="${R}" stroke-width="${2/sc}"/>${one?`<circle class="dot" r="${R*.42}"/>`:`<text class="num" y="${fs*.36}" text-anchor="middle" font-size="${fs*1.15}">${c.items.length}</text>`}<text class="lbl" x="${c.pl.x}" y="${c.pl.y+fs*.36}" text-anchor="${c.pl.a}" font-size="${fs}" stroke-width="${3.5/sc}">${esc(c.lab)}</text></g>`});
 el.innerHTML=`<svg viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="Bản đồ Việt Nam với vị trí các địa điểm"><rect class="m-sea" width="${MAP.W}" height="${MAP.H}"/>${g}${MAP.nb.map(d=>`<path class="m-nb" d="${d}" vector-effect="non-scaling-stroke"/>`).join('')}<path class="m-vn" d="${MAP.vn}" vector-effect="non-scaling-stroke"/>${lab(103.3,19.9,'LÀO')}${lab(104.7,12.9,'CAMPUCHIA')}${lab(103.6,23.3,'TRUNG QUỐC')}${lab(112.4,20.6,'BIỂN ĐÔNG',.35)}${arch(HS,'Quần đảo Hoàng Sa',112,17.5)}${arch(TS,'Quần đảo Trường Sa',113.4,12.1)}${mk}</svg>`;
 el.querySelectorAll('.mk').forEach(m=>{const pick=()=>{mapSel=mapSel===+m.dataset.cl?-1:+m.dataset.cl;drawMap();mapList()};m.onclick=pick;m.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}}})}
function mapList(){const el=$('mlist');if(!el)return;const item=s=>`<button class="mitem" type="button" data-site="${s.id}"><b>${esc(s.name)}</b><span>${esc(s.prov)} · ${esc(s.year)}</span></button>`;
 if(mapSel>=0&&clusters[mapSel]){const c=clusters[mapSel];el.innerHTML=`<h3>${esc(clusterLabel(c))}</h3><p class="note" style="margin:0 0 14px">${c.items.length} địa điểm · <button class="lnk" type="button" data-fk="mapclear">bỏ chọn, xem tất cả</button></p>${c.items.map(item).join('')}`;return}
 el.innerHTML=['Bắc','Trung','Nam'].map(r=>`<div class="sub">${REG[r]}</div>${SITES.filter(s=>s.reg===r).sort((a,b)=>b.ll[0]-a.ll[0]).map(item).join('')}`).join('')+'<p class="note">Chạm vào một điểm trên bản đồ để xem các địa điểm ở đó. Các điểm gần nhau được gộp lại.</p>'}

function mgrHTML(){const rows=[`<div class="mhd"><span>Địa điểm / di tích</span><span>Link thông tin</span><span>Link ảnh</span></div>`];
 const cell=(o,key)=>`<div class="mc"><input type="url" data-key="${key}" placeholder="https://…" aria-label="Link thông tin: ${esc(o.n||o.name)}" value="${esc(getLink(o,key))}"><span class="st" data-st="${key}"></span></div><div class="mc"><div class="ifld"><input type="url" data-ikey="${key}" placeholder="Dán link ảnh hoặc nhấn Ctrl+V để dán ảnh" aria-label="Link ảnh: ${esc(o.n||o.name)}" value="${esc(/^data:/.test(imgStore[key]||'')?'':(imgStore[key]||IMGS[key]||''))}"><label class="btn ghost sm fbtn" title="Chọn ảnh từ máy">Chọn file<input type="file" accept="image/*" data-ifile="${key}" hidden></label><button type="button" class="btn ghost sm" data-idel="${key}" title="Xóa ảnh này" hidden>✕</button></div><span class="st" data-ist="${key}"></span></div>`;
 for(const s of SITES){rows.push(`<section class="mgs" id="mg-${s.id}" data-n="${esc(norm(s.name+' '+s.city))}"><button type="button" class="sh" data-mgt="${s.id}" aria-expanded="true">${esc(s.name)}<i>${s.spots.length+1} ô · bấm để thu gọn</i></button>`);

 return `<h2 class="sec">Quản lý liên kết và ảnh (dành cho người biên soạn)</h2><div class="mfind"><input type="search" id="mQ" placeholder="Tìm nhanh địa điểm hoặc di tích, ví dụ: hầm đờ cát, chùa cầu…" aria-label="Tìm trong bảng liên kết và ảnh" autocomplete="off"><div class="mchips">${SITES.map(s=>`<button type="button" class="chip" data-mgj="${s.id}">${esc(s.name.replace(/^(Khu di tích|Thánh địa|Quần thể|Phố cổ|Chiến trường|Cố đô|Thành|Vịnh|Hoàng thành) /,'').replace(/^./,c=>c.toUpperCase()))}</button>`).join('')}</div><span class="note" id="mCnt"></span></div>

/* tìm nhanh + nhảy tới cụm + thu gọn từng cụm trong bảng */
function mgrNav(){const q=$('mQ');if(!q)return;
 const apply=()=>{const t=norm(q.value).trim();let n=0;
  document.querySelectorAll('#mgr .mgs').forEach(sec=>{const siteHit=!t||sec.dataset.n.includes(t);let any=false;
   sec.querySelectorAll('.mrow3').forEach(r=>{const hit=siteHit||r.dataset.n.includes(t);r.hidden=!hit;if(hit){any=true;n++}});
   sec.hidden=!any;if(t&&any)sec.classList.remove('shut')});
  $('mCnt').textContent=t?(n?n+' ô phù hợp':'Không có kết quả'):''};
 q.oninput=apply;

/* ===== ẢNH THẬT: tự tìm trên Wikipedia / Wikimedia Commons khi trang được mở có Internet ===== */
const IMGC=ls.json('dsvn.img.v2',{});let imgDirty=false,imgOff=0;
const DAY=864e5;
const saveImgC=()=>{if(imgDirty){imgDirty=false;ls.set('dsvn.img.v2',JSON.stringify(IMGC))}};
const wpOf=url=>{try{const u=new URL(url),m=u.hostname.match(/^([a-z]+)\.wikipedia\.org$/);if(!m||u.pathname.indexOf('/wiki/')!==0)return null;return m[1]+':'+decodeURIComponent(u.pathname.slice(6)).replace(/_/g,' ')}catch(e){return null}};
/* các tên bài Wikipedia có thể dùng để lấy ảnh đại diện: chỉ định trong dữ liệu (wp) + bài ở link của điểm; wp=[] nghĩa là bỏ qua */
function cands(o,key){const w=o.wp;if(Array.isArray(w)&&!w.length)return[];
 const l=Array.isArray(w)?w.slice():[],d=wpOf(getLink(o,key)||'');if(d&&!l.includes(d))l.push(d);return l.map(c=>c.replace(/_/g,' '))}
let imgStore=ls.json('dsvn.imgs',{});if(!imgStore||typeof imgStore!=='object'||Array.isArray(imgStore))imgStore={};
const persistImgs=()=>ls.set('dsvn.imgs',JSON.stringify(imgStore));
const safeImg=u=>/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(String(u).trim())?String(u).trim():safeUrl(u);
const directImg=(o,key)=>safeImg(imgStore[key]||IMGS[key]||o.img||'');
function imgOf(o,key){const d=directImg(o,key);if(d)return{u:d,direct:1};
 for(const c of cands(o,key)){const e=IMGC['p:'+c];if(e&&e.u)return{u:e.u,f:e.f,l:c.slice(0,c.indexOf(':'))}}
 const e=IMGC['c:'+key];if(e&&e.u)return{u:e.u,cr:e.cr,page:e.page,auto:1};return null}
const credit=(a,l)=>{const t=s=>String(s).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();return[t(a).slice(0,60),t(l).slice(0,30)].filter(Boolean).join(' · ')};
async function apiGet(url){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
/* ảnh đại diện của các bài Wikipedia (tối đa 50 bài / lần gọi) */
async function wpPageImages(lang,titles){
 const q=new URLSearchParams({action:'query',format:'json',formatversion:'2',prop:'pageimages',piprop:'thumbnail|name',pithumbsize:'960',redirects:'1',origin:'*',titles:titles.join('|')});
 const j=await apiGet(`https://${lang}.wikipedia.org/w/api.php?${q}`),qq=j.query||{},map={},res={},out={};
 (qq.normalized||[]).forEach(n=>map[n.from]=n.to);(qq.redirects||[]).forEach(n=>map[n.from]=n.to);
 (qq.pages||[]).forEach(p=>{if(p.thumbnail)res[p.title]={u:p.thumbnail.source,f:p.pageimage||''}});
 titles.forEach(t=>{let x=t;for(let i=0;i<3;i++)if(map[x]&&map[x]!==x)x=map[x];out[t]=res[x]||null});return out}
/* tìm ảnh trên Wikimedia Commons theo tên; chỉ nhận ảnh có tên/mô tả/thể loại khớp chặt với tên điểm và tên địa điểm */
const GEN=new Set(['den','chua','dinh','hang','dao','nha','khu','di','tich','va','and','quan','cua','the','cong','truong','mat','lang','nhom']);
const wordsOf=t=>norm(t).replace(/[^a-z0-9]+/g,' ').trim();
const tokensOf=t=>wordsOf(t).split(' ').filter(w=>w.length>1&&!GEN.has(w));
async function commonsFind(query,tokens,kw){
 const q=new URLSearchParams({action:'query',format:'json',formatversion:'2',generator:'search',gsrsearch:query+' filetype:bitmap',gsrnamespace:'6',gsrlimit:'8',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'960',iiextmetadatafilter:'Artist|LicenseShortName|ImageDescription|Categories|ObjectName',origin:'*'});
 const j=await apiGet(`https://commons.wikimedia.org/w/api.php?${q}`),pages=((j.query||{}).pages||[]).slice().sort((a,b)=>(a.index||0)-(b.index||0));
 for(const p of pages){const ii=(p.imageinfo||[])[0];if(!ii||!ii.thumburl)continue;
  const md=ii.extmetadata||{},val=k=>md[k]?String(md[k].value||''):'';
  const hay=' '+wordsOf(p.title+' '+val('ObjectName')+' '+val('ImageDescription').replace(/<[^>]*>/g,' ')+' '+val('Categories'))+' ';
  if(!tokens.every(t=>hay.includes(' '+t+' ')))continue;if(kw.length&&!kw.some(k=>hay.includes(k)))continue;
  const u=safeUrl(ii.thumburl);if(!u)continue;
  return{u,page:safeUrl(ii.descriptionurl)||('https://commons.wikimedia.org/wiki/'+encodeURIComponent(String(p.title).replace(/ /g,'_'))),cr:credit(val('Artist'),val('LicenseShortName'))}}
 return null}
const fresh=(e,now)=>e&&now-e.t<(e.u?14:2)*DAY;
function needTitles(objs,now){const need={};objs.forEach(([o,k])=>{if(directImg(o,k))return;cands(o,k).forEach(c=>{if(fresh(IMGC['p:'+c],now))return;const i=c.indexOf(':');(need[c.slice(0,i)]||(need[c.slice(0,i)]=new Set())).add(c.slice(i+1))})});return need}
async function fetchNeeded(need,now){let changed=false;
 await Promise.all(Object.keys(need).map(async l=>{const all=[...need[l]];for(let i=0;i<all.length;i+=40){const ts=all.slice(i,i+40),res=await wpPageImages(l,ts);ts.forEach(t=>{const r=res[t];IMGC['p:'+l+':'+t]=r?{u:r.u,f:r.f,t:now}:{n:1,t:now}});changed=true}}));return changed}
const imgJobs=new Map();
/* chuẩn bị ảnh cho một địa điểm (và các điểm nhỏ); trả về true nếu có ảnh mới */
function ensureImages(s){if(imgJobs.has(s.id))return imgJobs.get(s.id);
 const job=(async()=>{if(Date.now()<imgOff)return false;const now=Date.now(),objs=[[s,s.id],...s.spots.map(p=>[p,p.k])];let changed=false;
  try{changed=await fetchNeeded(needTitles(objs,now),now)}catch(e){imgOff=Date.now()+60000;return false}
  for(const[o,k]of objs){if(imgOf(o,k)||fresh(IMGC['c:'+k],now))continue;
   const seg=(o.n||o.name).split(/[&–(]/)[0].trim(),tokens=tokensOf(seg);if(!tokens.length)continue;
   try{const r=await commonsFind(seg+' '+s.name,tokens,o===s?[]:(s.kw||[]));IMGC['c:'+k]=r?Object.assign({t:now},r):{n:1,t:now};changed=true}catch(e){imgOff=Date.now()+60000;break}}
  if(changed)imgDirty=true;saveImgC();return changed})();
 imgJobs.set(s.id,job);job.then(()=>setTimeout(()=>imgJobs.delete(s.id),20000));return job}
