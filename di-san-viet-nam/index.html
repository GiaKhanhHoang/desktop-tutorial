<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>

#view{position:fixed;inset:0;z-index:3;overflow-y:auto;padding:calc(100px + env(safe-area-inset-top,0px)) 5vw 60px;background:rgba(10,15,12,.72);backdrop-filter:blur(3px)}#view.hide{display:none}
.wrap{max-width:1180px;margin:0 auto}

h2.sec{font:400 26px "Noto Serif",Georgia,serif;margin:44px 0 10px}

.tl{position:relative;max-width:780px;margin:10px 0 0 8px;padding-left:34px;border-left:1px solid var(--gold)}

.tn:before{content:"";position:absolute;left:-42px;top:22px;width:15px;height:15px;border-radius:50%;background:#101714;border:2px solid var(--c,var(--gold))}
.tn b{font:400 26px "Noto Serif",serif;color:var(--gold)}.tn h3{margin:4px 0;font-size:16px;font-weight:600}.tn p{margin:0 0 10px;font-size:12.5px;line-height:1.7;color:#cfcbbf}.tn .tags{margin:0}

.mlist h3{font:400 20px "Noto Serif",serif;margin:0 0 4px}.mlist .sub{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:18px 0 8px}.mlist .sub:first-of-type{margin-top:0}

.guide{max-width:700px;font-size:13px;line-height:1.8;color:#d4d0c5}.guide code{background:rgba(255,255,255,.08);padding:1px 5px;font-size:12px}
.mgr{max-width:860px;border:1px solid var(--line);background:var(--glass);margin:14px 0}.mgr .sh{padding:10px 14px;font:600 13px "Be Vietnam Pro",sans-serif;color:var(--gold);border-bottom:1px solid var(--line);background:rgba(215,181,109,.08)}
.mrow{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 78px;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid rgba(215,181,109,.12);font-size:12.5px}.mrow.sp{padding-left:28px;color:#d4d0c5}
.mrow input{width:100%;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(245,238,223,.25);color:var(--cream);padding:6px 8px;font:12px "Be Vietnam Pro",sans-serif}.mrow .st{font-size:10.5px;color:var(--dim)}.mrow .st.on{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
#hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}#hud.on{display:block}
#back{position:absolute;left:4vw;top:calc(84px + env(safe-area-inset-top,0px));pointer-events:auto}
.sitebox{position:absolute;left:4vw;top:calc(130px + env(safe-area-inset-top,0px));max-width:min(400px,90vw);padding:14px 16px 4px;background:rgba(12,18,15,.62);border-left:2px solid var(--gold);backdrop-filter:blur(4px);pointer-events:none}
.sitebox h1{font-size:clamp(26px,4vw,44px);text-shadow:0 2px 12px #000}.sitebox .eyebrow{text-shadow:0 1px 6px #000}

.sitebox .tags,.sitebox .snav,.sitebox .more{pointer-events:auto}.sitebox .tag{background:rgba(16,22,19,.78)}
.snav{display:flex;gap:14px;flex-wrap:wrap;font-size:11px}.snav button{background:none;border:0;padding:0;cursor:pointer;color:#e5dece;text-shadow:0 1px 6px #000}.snav button:hover{color:var(--gold)}
.panel{position:absolute;right:4vw;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(360px,90vw);padding:22px;background:var(--glass);border:1px solid rgba(215,181,109,.4);backdrop-filter:blur(14px);pointer-events:auto;max-height:55vh;overflow:auto}.panel.hide{display:none}
.panel small{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:10px;display:block;padding-right:28px}.panel h2{font:400 26px "Noto Serif",serif;margin:10px 0}.panel p{font-size:13px;line-height:1.75;color:#d4d0c5;margin:0 0 14px}.panel .tags{margin:-2px 0 10px}
.panel .x{position:absolute;right:8px;top:6px;width:30px;height:30px;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--cream);opacity:.7}.panel .x:hover{opacity:1;color:var(--gold)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}.linkrow input{flex:1;min-width:140px;background:rgba(255,255,255,.07);border:1px solid rgba(245,238,223,.3);color:var(--cream);padding:9px;font:12px "Be Vietnam Pro",sans-serif}
.btn{border:1px solid var(--gold);padding:9px 14px;background:var(--gold);color:#171b18;font:700 11px "Be Vietnam Pro",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}.btn.ghost{background:rgba(15,20,17,.6);color:var(--cream);border-color:rgba(245,238,223,.45)}.btn.ghost:hover,.btn.ghost.on{border-color:var(--gold);color:var(--gold)}.btn.sm{padding:7px 11px;font-size:10.5px}

.sitebox{z-index:2}.panel,.bottom,#back{z-index:3}
.sitebox .more{display:none;background:none;border:0;padding:0 0 10px;color:var(--gold);font-size:11px;letter-spacing:.08em;cursor:pointer}

.bottom{position:absolute;left:4vw;right:4vw;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;pointer-events:auto;padding-bottom:4px}.loc{flex:0 0 auto;background:rgba(16,22,19,.8);border:1px solid rgba(245,238,223,.25);color:#e5dece;padding:10px 13px;font-size:10.5px;letter-spacing:.06em;cursor:pointer}.loc.on,.loc:hover{border-color:var(--gold);color:var(--gold)}.loc.tour{border-color:rgba(215,181,109,.55);color:var(--gold)}.loc.tour.on{background:var(--gold);color:#171b18}
#tip{position:fixed;z-index:3;right:4vw;top:calc(92px + env(safe-area-inset-top,0px));font-size:10px;letter-spacing:.12em;color:#d8cfb9;text-align:right;pointer-events:none;display:none}#hud.on~#tip{display:block}

@media(max-width:860px){.mapwrap{grid-template-columns:1fr}}
@media(max-width:700px){#view{padding-top:calc(112px + env(safe-area-inset-top,0px))}#back{top:calc(72px + env(safe-area-inset-top,0px))}.sitebox{top:calc(112px + env(safe-area-inset-top,0px));padding:10px 12px 2px}.sitebox h1{font-size:24px;margin-bottom:8px}.sitebox .more{display:block}.sitebox:not(.open) .tags,.sitebox:not(.open) .snav{display:none}.brand span{display:none}nav button{font-size:11px;padding:6px}.x-lg{display:none}.panel{left:4vw;right:4vw;width:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-height:42vh}#tip{display:none!important}.sitebox p{display:none}.mrow{grid-template-columns:1fr}.mrow.sp{padding-left:14px}.mrow .st{display:none}}

{id:'co-loa',name:'Thành Cổ Loa',city:'Hà Nội',prov:'Hà Nội',reg:'Bắc',type:'thanh',year:'Thế kỷ III TCN',yn:-257,unesco:'',ll:[21.1117,105.875],bg:0xa3b09a,
 text:'Kinh đô của nhà nước Âu Lạc thời An Dương Vương, nổi tiếng với cấu trúc nhiều vòng thành. Gắn với truyền thuyết nỏ thần và Mỵ Châu – Trọng Thủy; năm 939 Ngô Quyền cũng chọn nơi đây làm kinh đô.',
 link:'https://vi.wikipedia.org/wiki/Thành_Cổ_Loa',cam:[0,0,0,100,.3,.9],
 spots:[{n:'Ba vòng thành',t:'Truyền thuyết kể thành có chín vòng xoáy trôn ốc, nhưng dấu tích còn lại là ba vòng: vòng ngoài dài khoảng 8 km, vòng giữa 6,5 km và vòng trong 1,6 km. Các vòng thành là những dải đất đắp cao, có hào nước bao quanh.',pos:[0,0,0],r:100,th:.3,ph:.85,link:''},
 {n:'Thành Nội & Đền Thượng',t:'Đền thờ An Dương Vương nằm ở trung tâm khu di tích, dựng trên gò đất được ví như đầu rồng, trước đền là hồ nước có giếng Ngọc. Khảo cổ ở khu vực này từng tìm thấy lò đúc và khuôn đúc mũi tên đồng ba cạnh.',pos:[0,2.5,-7],r:26,th:.15,ph:1.2,link:''},
 {n:'Giếng Ngọc',t:'Theo truyền thuyết, đây là nơi Trọng Thủy gieo mình vì hối hận sau cái chết của Mỵ Châu. Một cách giải thích khác cho rằng ngọc trai nhuốm máu Mỵ Châu được rửa ở đây nên sáng đẹp hơn.',pos:[0,0,6],r:19,th:.2,ph:1.15,link:''},
 {n:'Am Mỵ Châu',t:'Am thờ công chúa Mỵ Châu, nằm gần Đền Thượng và gắn với truyền thuyết nỏ thần.',pos:[13,2,7],r:17,th:.4,ph:1.2,link:'https://vi.wikipedia.org/wiki/Mỵ_Châu'},
 {n:'Đình Cổ Loa',t:'Đình Ngự Triều Di Quy, kiến trúc thời Hậu Lê, là nơi diễn ra các nghi lễ truyền thống của lễ hội Cổ Loa.',pos:[-13,2.5,8],r:18,th:-.4,ph:1.2,link:''}]},
{id:'my-son',name:'Thánh địa Mỹ Sơn',city:'Đà Nẵng (Quảng Nam cũ)',prov:'Đà Nẵng',reg:'Trung',type:'den',year:'Thế kỷ IV–XIII',yn:380,unesco:'Di sản thế giới 1999',ll:[15.7646,108.1239],bg:0x8fa58a,
 text:'Quần thể đền tháp Chăm Pa bằng gạch nung, dựng từ cuối thế kỷ IV đến thế kỷ XIII, nơi các vua Chăm cúng thần và tôn vinh tổ tiên. UNESCO ghi danh năm 1999.',
 link:'https://vi.wikipedia.org/wiki/Thánh_địa_Mỹ_Sơn',cam:[0,4,0,48,.6,1.1],
 spots:[{n:'Nhóm A (A1)',t:'Tháp chính A1 cao khoảng 24 m, từng được coi là đỉnh cao nghệ thuật kiến trúc Chăm. Nhóm A bị bom phá hủy nặng nề năm 1969, hiện chủ yếu còn là phế tích.',pos:[0,3,-4],r:22,th:.5,ph:1.15,link:''},
 {n:'Nhóm B – C',t:'Các tháp nhóm B, C còn khá nguyên vẹn, cho thấy lối xây gạch kín khít và hoa văn trang trí trên tường tháp; tháp B5 được xem là hình mẫu tiêu biểu còn lại của phong cách Mỹ Sơn A1.',pos:[-14,3,4],r:22,th:-.5,ph:1.15,link:''},
 {n:'Nhóm D',t:'Nhóm D gồm các công trình được bảo tồn khá tốt (khoảng thế kỷ X–XI); một số ngôi nhà ở đây từng được cải tạo làm nơi trưng bày hiện vật điêu khắc đá Chăm như tượng thần, bệ thờ, linga – yoni.',pos:[14,2,6],r:20,th:.9,ph:1.2,link:''},
 {n:'Thung lũng Mỹ Sơn',t:'Thánh địa nằm trong thung lũng rộng khoảng 2 km, bao quanh bởi hai dãy núi. Người Chăm coi đây là ngọn núi thiêng Mahaparvata, gắn với dòng sông thiêng Mahanadi (sông Thu Bồn).',pos:[0,6,-20],r:45,th:2.4,ph:1.1,link:''}]},
{id:'hoa-lu',name:'Cố đô Hoa Lư',city:'Ninh Bình',prov:'Ninh Bình',reg:'Bắc',type:'thanh',year:'968',yn:968,unesco:'Di sản thế giới 2014 (Tràng An)',ll:[20.275,105.9],bg:0xa9bcb0,
 text:'Kinh đô đầu tiên của nước Đại Cồ Việt dưới thời Đinh và Tiền Lê (968–1009), nằm giữa những dãy núi đá vôi làm thành lũy tự nhiên. Năm 1010 Lý Thái Tổ dời đô ra Thăng Long. Hoa Lư là một phần của Quần thể danh thắng Tràng An.',
 link:'https://vi.wikipedia.org/wiki/Cố_đô_Hoa_Lư',cam:[0,0,0,105,.35,.95],
 spots:[{n:'Thành Đông – Thành Tây',t:'Kinh đô gồm hai khu thành là Thành Đông và Thành Tây, tận dụng núi đá vôi bao quanh làm bức tường phòng thủ tự nhiên. Khu Thành Đông rộng khoảng 140 ha, có đền vua Đinh và đền vua Lê ở trung tâm.',pos:[0,0,0],r:105,th:.35,ph:.95,link:''},
 {n:'Đền vua Đinh Tiên Hoàng',t:'Đền thờ Đinh Tiên Hoàng (Đinh Bộ Lĩnh), người dựng nên nhà Đinh và đóng đô ở Hoa Lư. Đền được dựng từ thời Lý, xây lại từ thời Hậu Lê theo kiểu “nội công ngoại quốc”.',pos:[-14,3,-6],r:21,th:.2,ph:1.2,link:'https://vi.wikipedia.org/wiki/Đền_thờ_Vua_Đinh_Tiên_Hoàng'},
 {n:'Đền vua Lê Đại Hành',t:'Đền thờ Lê Đại Hành, cách đền vua Đinh khoảng 300 m, được dựng trên nền cung điện cũ của kinh đô Hoa Lư.',pos:[17,3,-4],r:21,th:.2,ph:1.2,link:'https://vi.wikipedia.org/wiki/Đền_thờ_Vua_Lê_Đại_Hành'},
 {n:'Chùa Nhất Trụ & cột kinh',t:'Chùa nằm gần đền vua Lê, nổi tiếng với cột kinh đá khắc kinh Phật thời Đinh, được xem là thạch kinh cổ nhất Việt Nam (thế kỷ X).',pos:[39,2,6],r:17,th:.3,ph:1.2,link:'https://vi.wikipedia.org/wiki/Chùa_Nhất_Trụ'},
 {n:'Lăng vua Đinh – núi Mã Yên',t:'Lăng vua Đinh nằm trên đỉnh núi Mã Yên; lăng vua Lê Đại Hành ở dưới chân núi.',pos:[-18,20,-28],r:26,th:.3,ph:1.1,link:''}]},
{id:'thang-long',name:'Hoàng thành Thăng Long',city:'Hà Nội',prov:'Hà Nội',reg:'Bắc',type:'thanh',year:'1010',yn:1010,unesco:'Di sản thế giới 2010',ll:[21.0367,105.84],bg:0x9ba69b,
 text:'Trung tâm quyền lực của nhiều triều đại, bắt đầu từ khi Lý Thái Tổ dời đô năm 1010. UNESCO ghi danh năm 2010.',
 link:'https://vi.wikipedia.org/wiki/Hoàng_thành_Thăng_Long',cam:[0,2,0,56,.63,1.15],
 spots:[{n:'Đoan Môn',t:'Cổng phía Nam của Hoàng thành, có năm lối vào, dẫn tới trục nghi lễ chính. Phần còn lại hiện nay có từ thời Lê sơ, về sau được tu bổ dưới thời Nguyễn.',pos:[0,2,20],r:29,th:.05,ph:1.25,link:'https://vi.wikipedia.org/wiki/Đoan_Môn'},
 {n:'Điện Kính Thiên',t:'Công trình trung tâm của Hoàng thành, nơi cử hành các nghi lễ quan trọng của triều đình. Ngày nay chỉ còn nền điện và thềm rồng đá thời Lê sơ.',pos:[0,2,-7],r:28,th:0,ph:1.28,link:'https://vi.wikipedia.org/wiki/Điện_Kính_Thiên'},
 {n:'Hậu Lâu',t:'Còn gọi là Tĩnh Bắc Lâu hay lầu Công chúa, được dựng phía sau cụm điện Kính Thiên.',pos:[0,3,-23],r:24,th:0,ph:1.22,link:''},
 {n:'Cột cờ Hà Nội',t:'Khởi công năm 1805, hoàn thành năm 1812 cùng thời với thành Hà Nội thời Nguyễn. Cột gồm ba tầng đế hình chóp cụt và thân cột, cao khoảng 33 m (hơn 40 m tính cả cán cờ).',y:'1805–1812',pos:[-27,8,1],r:27,th:-.7,ph:1.2,link:'https://vi.wikipedia.org/wiki/Cột_cờ_Hà_Nội'},
 {n:'Khu khảo cổ 18 Hoàng Diệu',t:'Nơi khai quật nhiều tầng văn hóa chồng lên nhau, từ thành Đại La thời Đường đến các cung điện Lý, Trần, Lê và kiến trúc thành Hà Nội thế kỷ XIX, cho thấy sự tiếp nối nhiều thế kỷ của kinh thành.',pos:[14,1,-8],r:26,th:.4,ph:1.25,link:''}]},
{id:'van-mieu',name:'Văn Miếu – Quốc Tử Giám',city:'Hà Nội',prov:'Hà Nội',reg:'Bắc',type:'den',year:'1070',yn:1070,unesco:'Bia Tiến sĩ · Di sản tư liệu UNESCO',ll:[21.0286,105.8355],bg:0x9fae9a,
 text:'Xây năm 1070 thờ Khổng Tử; năm 1076 lập Quốc Tử Giám – trường đại học đầu tiên của Việt Nam.',
 link:'https://vi.wikipedia.org/wiki/Văn_Miếu_–_Quốc_Tử_Giám',cam:[0,2,-2,46,.5,1.1],
 spots:[{n:'Cổng Văn Miếu Môn',t:'Cổng chính ngoài cùng, mở đầu trục thần đạo đi qua nhiều lớp sân.',pos:[0,2,24],r:24,th:0,ph:1.3,link:''},
 {n:'Khuê Văn Các',t:'Gác dựng năm 1805 trên bốn trụ gạch, từ năm 2012 được chọn làm biểu tượng của Hà Nội. Khuê là sao tượng trưng cho văn chương.',y:'1805',pos:[0,3,8],r:14,th:.6,ph:1.25,link:''},
 {n:'Giếng Thiên Quang & Bia Tiến sĩ',t:'Hai bên giếng Thiên Quang là 82 bia đá đặt trên lưng rùa, ghi tên các tiến sĩ của những khoa thi từ 1442 đến 1779 (bia được dựng từ năm 1484 đến 1780). Bộ bia được UNESCO ghi vào danh sách Di sản tư liệu thế giới.',y:'1484–1780',pos:[0,1,6],r:20,th:-.7,ph:1.2,link:'https://vi.wikipedia.org/wiki/Bia_tiến_sĩ_Văn_Miếu_Thăng_Long'},
 {n:'Đại Thành Môn & Đại Thành',t:'Khu thờ Khổng Tử và các bậc hiền triết, là điện chính của Văn Miếu.',pos:[0,3,-8],r:20,th:.3,ph:1.2,link:''},
 {n:'Nhà Thái Học',t:'Khu Quốc Tử Giám được dựng phía sau, kế thừa nơi học tập của các thế hệ nho sinh.',pos:[0,3,-19],r:20,th:0,ph:1.2,link:''}]},
{id:'thanh-nha-ho',name:'Thành nhà Hồ',city:'Thanh Hóa',prov:'Thanh Hóa',reg:'Trung',type:'thanh',year:'1397',yn:1397,unesco:'Di sản thế giới 2011',ll:[20.075,105.605],bg:0xa5b0a0,
 text:'Kinh đô Tây Đô do Hồ Quý Ly cho xây năm 1397, chỉ trong khoảng ba tháng. Thành nổi tiếng với tường và cổng xây bằng những khối đá lớn xếp khít, một tòa thành đá hiếm có ở Đông Nam Á. UNESCO ghi danh năm 2011.',
 link:'https://vi.wikipedia.org/wiki/Thành_nhà_Hồ',cam:[8,3,14,100,.6,1],
 spots:[{n:'Cổng Nam',t:'Cổng lớn nhất trong bốn cổng, mở ba cửa vòm cuốn bằng đá; cửa giữa cao khoảng 8 m, rộng gần 6 m. Trên cổng Nam và cổng Bắc từng có vọng lâu để canh gác và duyệt quân.',pos:[0,5,32],r:26,th:.25,ph:1.3,link:''},
 {n:'Tường thành đá',t:'Tường thành xây bằng những khối đá lớn đẽo vuông vắn, xếp khít chồng lên nhau, có khối nặng từ hơn chục đến hàng chục tấn. Mỗi cạnh của Hoàng thành dài gần 900 m.',pos:[-32,5,6],r:26,th:-1,ph:1.25,link:''},
 {n:'Nền điện Hoàng Nguyên',t:'Điện Hoàng Nguyên (chính điện) là nơi thiết triều và tế lễ. Khảo cổ cho thấy lớp kiến trúc thời Hồ nằm dưới mặt đất khoảng 1–1,5 m, mặt bằng còn gần như nguyên vẹn; hiện chỉ còn dấu tích nền móng.',pos:[0,1,-6],r:24,th:.3,ph:1.1,link:''},
 {n:'Đường Hoàng Gia',t:'Con đường dài khoảng 3,5 km do nhà Hồ xây năm 1402, nối Hoàng thành với Đàn tế Nam Giao; dấu tích được phát hiện qua khai quật cổng Nam năm 2008.',y:'1402',pos:[20,0,54],r:30,th:-.5,ph:1.15,link:''},
 {n:'Đàn tế Nam Giao',t:'Nằm dưới chân núi Đốn Sơn, cách Hoàng thành khoảng 2,5 km về phía đông nam; khảo cổ cho thấy nền đàn gồm năm tầng bó đá, tổng diện tích khoảng 30.000 m².',pos:[40,2,66],r:22,th:.6,ph:1.2,link:''}]},
{id:'hoi-an',name:'Phố cổ Hội An',city:'Đà Nẵng (Quảng Nam cũ)',prov:'Đà Nẵng',reg:'Trung',type:'pho',year:'Thế kỷ XVI–XVII',yn:1550,unesco:'Di sản thế giới 1999',ll:[15.8801,108.338],bg:0xb7b79d,
 text:'Thương cảng quốc tế sầm uất, nơi người Việt, Hoa, Nhật giao thoa. UNESCO ghi danh năm 1999.',
 link:'https://vi.wikipedia.org/wiki/Phố_cổ_Hội_An',cam:[0,2,0,40,.4,1.1],
 spots:[{n:'Chùa Cầu',t:'Cầu mái ngói bắc qua lạch nước, do cộng đồng thương nhân Nhật góp tiền xây vào khoảng thế kỷ XVII nên còn gọi là cầu Nhật Bản. Cầu được dựng lại năm 1817 và đại trùng tu giai đoạn 2022–2024.',y:'Thế kỷ XVII',pos:[0,2,-14],r:16,th:.7,ph:1.25,link:'https://vi.wikipedia.org/wiki/Chùa_Cầu'},
 {n:'Dãy nhà phố cổ',t:'Những ngôi nhà ống gỗ, mái ngói âm dương san sát, vừa để ở vừa buôn bán.',pos:[0,2,6],r:20,th:-.6,ph:1.25,link:''},
 {n:'Hội quán Phúc Kiến',t:'Hội quán của cộng đồng người Hoa, nổi bật với cổng tam quan và mái ngói trang trí cầu kỳ.',pos:[-14,3,4],r:14,th:.5,ph:1.2,link:''},
 {n:'Phố đèn lồng',t:'Hàng nghìn chiếc đèn lồng thắp sáng phố cổ vào đêm rằm, trở thành nét riêng của Hội An.',pos:[8,3,3],r:12,th:-.2,ph:1.3,link:''}]},
{id:'hue',name:'Quần thể Cố đô Huế',city:'Huế',prov:'Huế',reg:'Trung',type:'thanh',year:'1805',yn:1805,unesco:'Di sản thế giới 1993',ll:[16.4698,107.5786],bg:0xa8b3a5,
 text:'Kinh đô của nhà Nguyễn (1802–1945). Kinh thành Huế được khởi công năm 1805. UNESCO ghi danh năm 1993.',
 link:'https://vi.wikipedia.org/wiki/Quần_thể_di_tích_Cố_đô_Huế',cam:[0,3,0,60,.5,1.1],
 spots:[{n:'Kỳ Đài',t:'Cột cờ trước Ngọ Môn, dựng năm 1807 cùng thời gian xây Kinh thành. Cột cờ được thay nhiều lần; cột bê tông hiện nay xây năm 1948, cao khoảng 37 m.',y:'1807',pos:[0,5,34],r:26,th:.3,ph:1.2,link:'https://vi.wikipedia.org/wiki/Kỳ_đài_(Huế)'},
 {n:'Ngọ Môn',t:'Cổng chính phía Nam Hoàng thành, xây năm 1833 dưới thời Minh Mạng trên nền Nam Khuyết đài cũ; lầu Ngũ Phụng phía trên là nơi vua ban chiếu, lễ ban sóc.',y:'1833',pos:[0,3,20],r:28,th:0,ph:1.25,link:'https://vi.wikipedia.org/wiki/Ngọ_Môn_(Hoàng_thành_Huế)'},
 {n:'Điện Thái Hòa',t:'Điện thiết triều của nhà Nguyễn, nơi diễn ra lễ đăng quang và các đại lễ. Khởi công năm 1805, được Minh Mạng cho xây lại ở vị trí hiện nay năm 1833; điện có hệ thống cột son thếp vàng rất đặc sắc.',y:'1805 · 1833',pos:[0,3,-2],r:26,th:1.15,ph:1.15,link:'https://vi.wikipedia.org/wiki/Điện_Thái_Hòa_(Hoàng_thành_Huế)'},
 {n:'Cửu Đỉnh',t:'Chín đỉnh đồng do vua Minh Mạng cho đúc từ năm 1835, hoàn thành năm 1837; mỗi đỉnh mang tên một vị vua nhà Nguyễn và khắc hình cảnh vật, sản vật của đất nước. Chúng đặt trong sân Thế Miếu, trước Hiển Lâm Các.',y:'1835–1837',pos:[14,2,-14],r:16,th:-.5,ph:1.2,link:'https://vi.wikipedia.org/wiki/Cửu_Đỉnh_(Nhà_Nguyễn)'}]},
{id:'duc-ba',name:'Nhà thờ Đức Bà & Bưu điện Sài Gòn',city:'TP. Hồ Chí Minh',prov:'TP. Hồ Chí Minh',reg:'Nam',type:'pho',year:'1877–1880',yn:1877,unesco:'',ll:[10.7798,106.699],bg:0xb5bcbf,
 text:'Cụm kiến trúc thời Pháp thuộc ở trung tâm Sài Gòn. Nhà thờ Đức Bà xây năm 1877–1880 với gạch, ngói, kính màu nhập từ Pháp; Bưu điện Trung tâm xây giai đoạn 1886–1891 ở ngay bên cạnh, quanh Công trường Công xã Paris.',
 link:'https://vi.wikipedia.org/wiki/Nhà_thờ_chính_tòa_Đức_Bà_Sài_Gòn',cam:[14,5,-10,80,.22,1.1],
 spots:[{n:'Mặt chính Nhà thờ',t:'Nhà thờ do kiến trúc sư Jules Bourard thiết kế theo phong cách Roman, với hai tháp chuông. Lễ cung hiến ngày 11/4/1880 (Lễ Phục Sinh); năm 1895 hai tháp được thêm mái chóp, cao khoảng 58 m.',y:'1877–1880',pos:[0,10,-14],r:34,th:.18,ph:1.25,link:''},
 {n:'Tượng Đức Mẹ Hòa Bình',t:'Tượng bằng đá cẩm thạch trắng của Ý, cao khoảng 4,6 m, được đặt trước nhà thờ năm 1959; tên gọi “Nhà thờ Đức Bà” thường gắn với bức tượng này.',y:'1959',pos:[0,4,3.5],r:12,th:.3,ph:1.25,link:'https://vi.wikipedia.org/wiki/Tượng_Đức_Bà_Hòa_Bình'},
 {n:'Bưu điện Trung tâm',t:'Công trình xây 1886–1891 theo thiết kế của các kiến trúc sư người Pháp Villedieu và Foulhoux, mang phong cách chiết trung; sảnh chính có mái vòm sắt kính gợi nhà ga. Bưu điện vẫn hoạt động đến ngày nay.',y:'1886–1891',pos:[42,5,-6],r:32,th:-.12,ph:1.25,link:'https://vi.wikipedia.org/wiki/Bưu_điện_Sài_Gòn'},

{id:'ba-dinh',name:'Ba Đình – Lăng Chủ tịch Hồ Chí Minh',city:'Hà Nội',prov:'Hà Nội',reg:'Bắc',type:'cm',year:'1945 · 1975',yn:1945,unesco:'',ll:[21.0368,105.8346],bg:0xb4bdb4,
 text:'Nơi Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập ngày 2/9/1945. Lăng Chủ tịch Hồ Chí Minh khởi công ngày 2/9/1973 và khánh thành ngày 29/8/1975, xây ngay trên nền lễ đài cũ giữa quảng trường. Bố cục trong mô hình mang tính minh họa.',
 link:'https://vi.wikipedia.org/wiki/Lăng_Chủ_tịch_Hồ_Chí_Minh',cam:[0,4,-4,95,.3,1.05],
 spots:[{n:'Quảng trường Ba Đình',t:'Quảng trường rộng lớn trước Lăng, nơi diễn ra buổi lễ đọc Tuyên ngôn Độc lập ngày 2/9/1945 và nhiều sự kiện trọng đại của đất nước.',y:'2/9/1945',pos:[0,1,16],r:46,th:.15,ph:1.05,link:''},
 {n:'Lăng Chủ tịch Hồ Chí Minh',t:'Khởi công ngày 2/9/1973, khánh thành ngày 29/8/1975, được xây trên nền lễ đài cũ giữa quảng trường, nơi Chủ tịch Hồ Chí Minh từng chủ trì các cuộc mít tinh lớn. Công trình thiết kế có sự tham gia của chuyên gia Liên Xô.',y:'1973–1975',pos:[0,6,-30],r:40,th:0,ph:1.2,link:'https://vi.wikipedia.org/wiki/Lăng_Chủ_tịch_Hồ_Chí_Minh'},
 {n:'Chùa Một Cột',t:'Chùa Diên Hựu do vua Lý Thái Tông cho xây từ năm 1049, dựng trên một cột đá giữa hồ, mô phỏng đài sen của Phật Quan Âm theo giấc mơ của nhà vua. Chùa bị phá năm 1954 và được xây lại năm 1955.',y:'1049',pos:[46,3,-14],r:15,th:-.5,ph:1.15,link:'https://vi.wikipedia.org/wiki/Chùa_Một_Cột'},
 {n:'Nhà sàn Bác Hồ',t:'Ngôi nhà sàn gỗ hai tầng mái ngói xây năm 1958 trong Khu Phủ Chủ tịch; Chủ tịch Hồ Chí Minh ở và làm việc tại đây từ tháng 5/1958.',y:'1958',pos:[-46,3,-4],r:15,th:.5,ph:1.15,link:'https://vi.wikipedia.org/wiki/Khu_di_tích_Phủ_Chủ_tịch'},
 {n:'Phủ Chủ tịch',t:'Tòa nhà màu vàng, nguyên là phủ Toàn quyền Đông Dương do người Pháp xây đầu thế kỷ XX. Khu di tích Chủ tịch Hồ Chí Minh tại Phủ Chủ tịch là một trong 10 di tích đầu tiên được xếp hạng Di tích quốc gia đặc biệt (2009).',pos:[-46,4,-24],r:26,th:.3,ph:1.2,link:'https://vi.wikipedia.org/wiki/Khu_di_tích_Phủ_Chủ_tịch'}]},
{id:'cu-chi',name:'Địa đạo Củ Chi',city:'TP. Hồ Chí Minh',prov:'TP. Hồ Chí Minh',reg:'Nam',type:'cm',year:'1948–1975',yn:1948,unesco:'',ll:[11.14,106.46],bg:0x9fae98,
 text:'Hệ thống đường hầm nhiều tầng bắt đầu hình thành khoảng năm 1948 trong kháng chiến chống Pháp, sau đó được nối thông và mở rộng trong chiến tranh chống Mỹ; ước tính tổng chiều dài từ khoảng 200 đến 250 km. Khu Bến Dược và Bến Đình được bảo tồn để tham quan. Mô hình là mặt cắt minh họa, không đúng tỉ lệ.',
 link:'https://vi.wikipedia.org/wiki/Địa_đạo_Củ_Chi',cam:[0,-2,0,95,.6,.95],
 spots:[{n:'Cửa hầm ngụy trang',t:'Các cửa hầm được ngụy trang kín đáo dưới lớp đất, lá khô và cỏ, rất khó phát hiện từ trên mặt đất.',pos:[-20,0,-12],r:10,th:.5,ph:1.1,link:''},
 {n:'Mặt cắt ba tầng',t:'Hệ thống chia thành ba tầng: tầng trên sâu khoảng 3 m, tầng giữa khoảng 5–8 m và tầng dưới có chỗ sâu hơn 8–12 m; các tầng nối với nhau bằng những đường hầm đứng.',pos:[0,-5,0],r:64,th:.3,ph:1.42,link:''},
 {n:'Khu Bến Dược',t:'Một trong hai khu di tích được bảo tồn để tham quan, có đoạn địa đạo và Đền Bến Dược tưởng niệm.',pos:[-30,2,18],r:16,th:.3,ph:1.2,link:'https://vi.wikipedia.org/wiki/Đền_Bến_Dược'},

{id:'dien-bien',name:'Chiến trường Điện Biên Phủ',city:'Điện Biên',prov:'Điện Biên',reg:'Bắc',type:'cm',year:'1954',yn:1954,unesco:'',ll:[21.386,103.016],bg:0x9fb0a5,

 {n:'Đồi A1',t:'Cứ điểm mạnh nhất của Pháp trong tập đoàn cứ điểm và là nơi diễn ra trận đánh ác liệt nhất chiến dịch. Quân ta đào đường hầm đưa khối bộc phá khoảng một tấn vào sát hầm ngầm đối phương; đến sáng 7/5 làm chủ hoàn toàn đồi.',pos:[24,7,-4],r:18,th:.5,ph:1.15,link:'https://vi.wikipedia.org/wiki/Trận_đồi_A1'},
 {n:'Hầm Đờ Cát',t:'Sở chỉ huy của tướng Đờ Cát (De Castries) ở trung tâm cánh đồng Mường Thanh, gồm bốn gian, rộng khoảng 20 × 8 m. Lúc 17 giờ 30 ngày 7/5/1954, lá cờ “Quyết chiến Quyết thắng” được phất trên nóc hầm, kết thúc chiến dịch.',y:'7/5/1954',pos:[0,1.5,8],r:15,th:.3,ph:1.2,link:'https://baovanhoa.vn/multimedia/can-ham-noi-tieng-o-dien-bien-noi-bat-song-tuong-de-castries-91407.html'},

 {n:'Hòn Trống Mái',t:'Hai khối đá đứng đối diện nhau giữa biển, cao khoảng 12 m, được ví như đôi gà trống mái (còn gọi là hòn Gà Chọi) và là một biểu tượng của Hạ Long.',pos:[-19,6,16],r:32,th:.2,ph:1.15,link:''},
 {n:'Đảo Ti Tốp',t:'Hòn đảo cách cảng Bãi Cháy khoảng 7–8 km, được đặt tên năm 1962 để ghi dấu chuyến thăm của Chủ tịch Hồ Chí Minh cùng nhà du hành vũ trụ Gherman Titov. Đảo có bãi tắm và khoảng 400 bậc thang lên đài ngắm cảnh.',y:'1962',pos:[-6,5,-12],r:38,th:.5,ph:1.15,link:'https://vi.wikipedia.org/wiki/Đảo_Ti_Tốp'},

function mapList(){const el=$('mlist');if(!el)return;const item=s=>`<button class="mitem" type="button" data-site="${s.id}"><b>${esc(s.name)}</b><span>${esc(s.prov)} · ${esc(s.year)}</span></button>`;
 if(mapSel>=0&&clusters[mapSel]){const c=clusters[mapSel];el.innerHTML=`<h3>${esc(clusterLabel(c))}</h3><p class="note" style="margin:0 0 14px">${c.items.length} địa điểm · <button class="lnk" type="button" data-fk="mapclear">bỏ chọn, xem tất cả</button></p>${c.items.map(item).join('')}`;return}
 el.innerHTML=['Bắc','Trung','Nam'].map(r=>`<div class="sub">${REG[r]}</div>${SITES.filter(s=>s.reg===r).sort((a,b)=>b.ll[0]-a.ll[0]).map(item).join('')}`).join('')+'<p class="note">Chạm vào một điểm trên bản đồ để xem các địa điểm ở đó. Các điểm gần nhau được gộp lại.</p>'}
function renderMap(){
 $('view').innerHTML=`<div class="wrap"><div class="eyebrow">Theo vị trí</div><h1>Di sản trên dải đất <em>hình chữ S</em></h1><p class="lead">Vị trí các địa điểm trên bản đồ đơn giản của Việt Nam. Chạm vào một điểm để xem địa điểm ở đó, rồi vào tham quan 3D.</p>
 <div class="mapwrap"><div class="map" id="mapBox"></div><div class="mlist" id="mlist"></div></div></div>`;
 drawMap();mapList()}
function renderTech(){
 const done=['Mô hình 3D tương tác của từng địa điểm, xoay – zoom (cả cảm ứng hai ngón).','Điểm nhấn số trong mô hình: bấm số trên cảnh để tới từng di tích nhỏ, kèm trang giới thiệu bên ngoài.','Bản đồ đơn giản của Việt Nam (gom cụm các địa điểm gần nhau) và dòng thời gian theo từng thời kỳ.','Liên kết giữa các danh mục: miền, tỉnh, loại hình, thời kỳ, danh hiệu UNESCO.','Thuyết minh bằng giọng đọc của thiết bị và chế độ tham quan tự động.'];
 const todo=['<b>AR / VR</b> – đặt lớp phục dựng lên cảnh thật hoặc tham quan nhập vai.','<b>Quét 3D & ảnh độ phân giải cao</b> – lưu hình dạng, hoa văn, hiện trạng hiện vật; thay các mô hình khối đơn giản bằng mô hình thật.','<b>Bản đồ GIS</b> – gắn vị trí với dữ liệu khảo cổ, lớp bản đồ cổ.','<b>Thuyết minh đa ngôn ngữ</b> – giọng đọc thu sẵn, phụ đề, tiếng Anh/Pháp/Trung.'];
 $('view').innerHTML=`<div class="wrap"><div class="eyebrow">Công nghệ số</div><h1>Công nghệ <em>kể chuyện</em> di sản</h1>
 <p class="lead">Những công nghệ giúp người xem tiếp cận di tích mà không cần có mặt tại chỗ, và cách trang này áp dụng chúng.</p>
 <h2 class="sec" style="margin-top:8px">Đã có trong bản này</h2><ul class="tech">${done.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <h2 class="sec">Hướng nâng cấp</h2><ul class="tech">${todo.map(x=>`<li>${x}</li>`).join('')}
 <li style="color:#9b9e91">Lưu ý: các mô hình trong trang này là minh họa đơn giản, không thay thế tư liệu khoa học chính thức. Thông tin tóm tắt từ nguồn công khai; hãy đối chiếu trước khi dùng cho mục đích học thuật.</li></ul>
 ${EDIT?mgrHTML():''}</div>`;
 if(EDIT)mgrBind()}
/* --- quản lý liên kết --- */
function mgrHTML(){const rows=[];
 for(const s of SITES){rows.push(`<div class="sh">${esc(s.name)}</div>`);
  const r=(o,key,lbl,cls)=>`<div class="mrow ${cls}"><span>${esc(lbl)}</span><input type="url" id="m-${key.replace('.','-')}" data-key="${key}" placeholder="https://…" aria-label="Link: ${esc(lbl)}" value="${esc(getLink(o,key))}"><span class="st" data-st="${key}"></span></div>`;
  rows.push(r(s,s.id,'Trang giới thiệu chung','sp'));s.spots.forEach((p,j)=>rows.push(r(p,s.id+'.'+j,(j+1)+'. '+p.n,'sp')))}
 return `<h2 class="sec">Quản lý liên kết (dành cho người biên soạn)</h2><div class="guide"><p>Điền link trang giới thiệu cho từng địa danh và di tích nhỏ, hoặc để trống. Link được lưu ngay trên trình duyệt này. Để giữ cố định, bấm <b>Sao chép khối LINKS</b> rồi dán thay cho khối <code>const LINKS={…}</code> ở đầu phần dữ liệu trong file; hoặc điền thẳng vào <code>link:''</code> của từng điểm. Đặt <code>EDIT=false</code> khi đưa lên cho người xem.</p></div>
 <div class="mgr" id="mgr">${rows.join('')}</div><div class="row"><button class="btn" type="button" id="mCopy">Sao chép khối LINKS</button><button class="btn ghost" type="button" id="mClear">Xóa link đã nhập trên trình duyệt này</button></div>`}
function mgrBind(){const stat=k=>{const e=document.querySelector(`[data-st="${k}"]`);if(!e)return;const [o]=ownerOf(k);const t=linkSrc(o,k);e.textContent=t;e.className='st'+(t==='đã nhập'?' on':'')};
 const ownerOf=k=>{const[id,n]=k.split('.');const s=byId[id];return [n===undefined?s:s.spots[+n]]};
 document.querySelectorAll('#mgr input').forEach(i=>{const k=i.dataset.key;stat(k);
  i.onchange=()=>{const v=i.value.trim();if(!v)delete store[k];else{const u=safeUrl(/^https?:\/\//i.test(v)?v:'https://'+v);if(!u){toast('Link không hợp lệ: '+v);i.value=getLink(ownerOf(k)[0],k);return}store[k]=u}persist();i.value=getLink(ownerOf(k)[0],k);stat(k)}});
 $('mCopy').onclick=()=>{const out=Object.keys(store).filter(k=>store[k]).map(k=>` ${JSON.stringify(k)}:${JSON.stringify(store[k])},`);const txt='const LINKS={\n'+Object.keys(LINKS).map(k=>` ${JSON.stringify(k)}:${JSON.stringify(LINKS[k])},`).filter(l=>!out.some(o=>o.startsWith(l.split(':')[0]+':'))).concat(out).join('\n')+'\n};';
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép khối LINKS')}catch(e){toast('Không sao chép được; hãy chọn và sao chép thủ công')}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Đã sao chép khối LINKS'),fb);else fb()};
 $('mClear').onclick=()=>{store={};persist();renderTech();toast('Đã xóa link đã nhập')}}
/* --- chế độ xem một địa điểm --- */
const pinList=[],pinPos=[];
function openSite(s,j=-1){if(view!=='site')from=view;view='site';sel=s;spotIdx=-1;stopTour();hush();
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
 $('hud').classList.add('on');$('view').classList.add('hide');
 if(HAS3D){load(s);auto=true;go(s.cam,true)}else toast('Thiết bị không hỗ trợ đồ họa 3D; vẫn xem được thông tin các điểm.');
 $('sbox').classList.remove('open');$('sMore').textContent='Liên kết ▾';$('sMore').setAttribute('aria-expanded','false');$('sEye').textContent=s.city+' · '+s.year;$('sName').textContent=s.name;$('sDesc').textContent=s.text;
 $('back').textContent='← '+({places:'Địa điểm',map:'Bản đồ',timeline:'Dòng thời gian',tech:'Quay lại'}[from]||'Địa điểm');
 $('sTags').innerHTML=`<button class="tag" type="button" data-a="reg">${REG[s.reg]}</button><button class="tag" type="button" data-a="map">${esc(s.prov)}</button><button class="tag" type="button" data-a="type" style="--c:${TYPES[s.type].c}"><i></i>${esc(TYPES[s.type].n)}</button><button class="tag" type="button" data-a="era">${esc(s.era.n)}</button>${s.unesco?`<button class="tag u" type="button" data-a="un">${esc(s.unesco)}</button>`:''}`;
 const ord=[...SITES].sort((a,b)=>a.yn-b.yn),k=ord.indexOf(s),pv=ord[k-1],nx=ord[k+1];
 $('sNav').innerHTML=(pv?`<button type="button" data-site="${pv.id}">‹ ${esc(pv.name)} · ${esc(pv.year)}</button>`:'')+(nx?`<button type="button" data-site="${nx.id}">${esc(nx.name)} · ${esc(nx.year)} ›</button>`:'')+`<button type="button" data-a="tl">Xem trên dòng thời gian</button><button type="button" data-a="map">Xem trên bản đồ</button>`;
 $('spots').innerHTML=`<button class="loc tour" id="tourBtn" type="button">▶ TỰ ĐỘNG</button>`+s.spots.map((p,i)=>`<button class="loc" type="button" data-j="${i}">${String(i+1).padStart(2,'0')} · ${esc(p.n.toUpperCase())}</button>`).join('')+`<button class="loc" id="siteInfo" type="button">THÔNG TIN CHUNG</button>`;
 $('pins').innerHTML='';pinList.length=0;pinPos.length=0;
 s.spots.forEach((p,i)=>{const b=document.createElement('button');b.className='pin';b.type='button';b.textContent=i+1;b.setAttribute('aria-label','Điểm '+(i+1)+': '+p.n);b.title=p.n;b.onclick=()=>spot(i);$('pins').appendChild(b);pinList.push(b);pinPos.push(p.mk||[p.pos[0],p.pos[1]+4,p.pos[2]])});
 $('panel').classList.add('hide');mark(-1);
 if(j>=0&&s.spots[j])spot(j)}
function mark(j){document.querySelectorAll('#spots .loc[data-j]').forEach(b=>b.classList.toggle('on',+b.dataset.j===j));pinList.forEach((b,i)=>b.classList.toggle('on',i===j))}
function linkBox(o,key,host){const u=getLink(o,key);
 const edit=()=>{host.innerHTML=`<div class="linkrow"><input type="url" id="lkIn" placeholder="Dán link trang giới thiệu…" aria-label="Link trang giới thiệu" value="${esc(store[key]||o.link||'')}"><button class="btn" type="button" id="lkSave">Lưu</button></div><div class="note" id="lkNote">Chưa có link. Dán tại đây (lưu trên trình duyệt này), hoặc điền vào <b>link:''</b> trong dữ liệu để lưu cố định.</div>`;
  const i=$('lkIn');const save=()=>{const v=i.value.trim();if(!v){delete store[key];persist();linkBox(o,key,host);return}const x=safeUrl(/^https?:\/\//i.test(v)?v:'https://'+v);if(!x){$('lkNote').textContent='Link không hợp lệ. Hãy dán địa chỉ bắt đầu bằng https://';return}store[key]=x;persist();linkBox(o,key,host)};
  $('lkSave').onclick=save;i.onkeydown=e=>{if(e.key==='Enter')save()}};
 if(u){host.innerHTML=`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Mở trang giới thiệu ↗</a>`+(EDIT?'<button class="lk" type="button">sửa link</button>':'');if(EDIT)host.querySelector('.lk').onclick=edit}
 else if(EDIT)edit();else host.innerHTML=''}
function panel(k,t,p,o,key,y){$('pK').textContent=k;$('pT').textContent=t;$('pP').textContent=p;$('pY').innerHTML=y?`<span class="tag">${esc(y)}</span>`:'';$('pY').style.display=y?'':'none';linkBox(o,key,$('pL'));$('panel').classList.remove('hide');$('panel').scrollTop=0}
function info(){spotIdx=-1;auto=true;go(sel.cam);panel('Địa danh · '+sel.year,sel.name,sel.text,sel,sel.id);mark(-1);setHash(sel.id,true);if(voiceOn)speak(sel.name+'. '+sel.text)}
function spot(j,keep){const p=sel.spots[j];if(!p)return;if(!keep)stopTour();spotIdx=j;auto=false;go([p.pos[0],p.pos[1],p.pos[2],p.r,p.th,p.ph]);
 panel('ĐIỂM '+String(j+1).padStart(2,'0')+' / '+String(sel.spots.length).padStart(2,'0')+' · '+sel.name,p.n,p.t,p,p.k,p.y);mark(j);setHash(sel.id+'.'+j,true);
 if(voiceOn)speak(p.n+'. '+p.t,()=>{if(tour.on){clearTimeout(tour.t);tour.t=setTimeout(tourNext,1200)}});
 if(tour.on)tourWait(p)}
function step(d){if(!sel)return;const n=sel.spots.length;spot(spotIdx<0?(d>0?0:n-1):(spotIdx+d+n)%n)}
function pinsUpdate(){if(!pinList.length)return;const W=innerWidth,H=innerHeight,v=pinsUpdate.v||(pinsUpdate.v=new THREE.Vector3());
 pinList.forEach((b,i)=>{const q=pinPos[i];v.set(q[0],q[1],q[2]).project(camera);const sx=(v.x*.5+.5)*W,sy=(-v.y*.5+.5)*H,ok=v.z<1&&sx>-20&&sx<W+20&&sy>66&&sy<H+20;b.hidden=!ok;if(ok)b.style.transform=`translate(${(sx-14).toFixed(1)}px,${(sy-14).toFixed(1)}px)`})}
/* --- sự kiện chung --- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('back').onclick=()=>show(VIEWS.includes(from)?from:'places');
$('sMore').onclick=()=>{const o=$('sbox').classList.toggle('open');$('sMore').textContent=o?'Thu gọn ▴':'Liên kết ▾';$('sMore').setAttribute('aria-expanded',o)};
$('pX').onclick=()=>{$('panel').classList.add('hide');if(spotIdx>=0){stopTour();hush()}};
$('pPrev').onclick=()=>step(-1);$('pNext').onclick=()=>step(1);
$('pSay').onclick=()=>{if(!TTS){toast('Trình duyệt này chưa hỗ trợ đọc thuyết minh.');return}voiceOn=!voiceOn;$('pSay').setAttribute('aria-pressed',voiceOn);$('pSay').classList.toggle('on',voiceOn);$('pSay').textContent=voiceOn?'Tắt thuyết minh':'Nghe thuyết minh';
 if(voiceOn){const p=spotIdx>=0?sel.spots[spotIdx]:null;speak(p?p.n+'. '+p.t:sel.name+'. '+sel.text)}else hush()};
if(!TTS)$('pSay').hidden=true;
$('spots').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='tourBtn'){tour.on?(stopTour(),hush()):startTour()}else if(b.id==='siteInfo'){stopTour();info()}else if(b.dataset.j!==undefined)spot(+b.dataset.j)};
$('sTags').onclick=$('sNav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.site){show(b.dataset.site);return}
 const a=b.dataset.a,s=sel;
 if(a==='reg'){Object.assign(F,{reg:s.reg,type:'Tất cả',un:false,q:''});show('places')}
 else if(a==='type'){Object.assign(F,{reg:'Tất cả',type:s.type,un:false,q:''});show('places')}
 else if(a==='un'){Object.assign(F,{reg:'Tất cả',type:'Tất cả',un:true,q:''});show('places')}
 else if(a==='map'){mapFocus=s.id;show('map')}
 else if(a==='era'||a==='tl'){tlFocus=ERAS.indexOf(s.era);show('timeline')}};
$('view').onclick=e=>{const b=e.target.closest('[data-site],[data-go],[data-fk],[data-eid]');if(!b)return;
 if(b.dataset.site){show(b.dataset.site)}
 else if(b.dataset.go){show(b.dataset.go)}
 else if(b.dataset.eid!==undefined){const el=$('view').querySelector(`.era[data-eid="${b.dataset.eid}"]`);if(el)$('view').scrollTo({top:Math.max(0,el.getBoundingClientRect().top-$('view').getBoundingClientRect().top+$('view').scrollTop-100),behavior:RM?'auto':'smooth'})}
 else if(b.dataset.fk==='mapclear'){mapSel=-1;drawMap();mapList()}
 else if(b.dataset.fk){const k=b.dataset.fk;if(k==='un')F.un=!F.un;else F[k]=b.dataset.fv;
  document.querySelectorAll('.chip[data-fk]').forEach(c=>c.classList.toggle('on',c.dataset.fk==='un'?F.un:F[c.dataset.fk]===c.dataset.fv));grid()}};
addEventListener('keydown',e=>{if(view!=='site'||/INPUT|TEXTAREA/.test((e.target.tagName||'')))return;
 if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')$('back').click()});
addEventListener('resize',()=>{if(view==='map')drawMap()});
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,((now||last)-last)/1000));last=now||last;
 if(!HAS3D)return;
 gs.vy=view==='site'&&innerWidth<=700&&!$('panel').classList.contains('hide')?.17:0;
 if(auto&&!ptrs.size&&!RM)gs.th+=dt*.045;
 follow(dt);place();if(view==='site')pinsUpdate();renderer.render(scene,camera)})(last);
if(TTS&&speechSynthesis.getVoices)try{speechSynthesis.getVoices()}catch(e){}
show(location.hash.slice(1)||'places',false);
})();
</script></body></html>
