 <label for="aIntro">Đoạn giới thiệu</label><textarea id="aIntro" style="min-height:96px">${esc(about.intro)}</textarea>
 ${about.secs.map((s,i)=>`<div class="asecf" data-i="${i}"><label for="aH${i}">Mục ${i+1} – tiêu đề</label><input id="aH${i}" data-f="h" value="${esc(s.h)}"><label for="aB${i}">Nội dung (dòng bắt đầu bằng “- ” sẽ thành gạch đầu dòng)</label><textarea id="aB${i}" data-f="b">${esc(s.b)}</textarea><div class="row"><button class="btn ghost sm" type="button" data-ab="up:${i}"${i?'':' disabled'}>↑ Lên</button><button class="btn ghost sm" type="button" data-ab="down:${i}"${i<about.secs.length-1?'':' disabled'}>↓ Xuống</button><button class="btn ghost sm" type="button" data-ab="del:${i}">Xóa mục</button></div></div>`).join('')}
 <div class="row" style="margin-top:14px"><button class="btn ghost" type="button" data-ab="add">+ Thêm mục</button><button class="btn" type="button" data-ab="save">Lưu nội dung</button></div>
 <p class="ahint">Mẹo: nhấn Ctrl+S (hoặc ⌘S) để lưu. Nội dung được lưu ngay trên trình duyệt này; dùng nút sao chép để dán sang bài thuyết trình, nút ↺ để quay về bản gốc.</p></div>`}
function setDirty(v){aDirty=v;const b=document.querySelector('.atools [data-ab=save]');if(b)b.classList.toggle('dirty',v)}
function aboutSave(){if(ls.set('dsvn.about',JSON.stringify(about))){setDirty(false);toast('Đã lưu nội dung')}else toast('Trình duyệt không cho phép lưu (có thể đang ở chế độ riêng tư). Hãy dùng nút sao chép để giữ lại nội dung.')}
function aboutText(){return[about.title,'',about.intro].concat(...about.secs.map(s=>['',s.h.toUpperCase(),s.b])).join('\n')}
function aboutAct(a){
 if(a==='edit'){aEdit=true;renderAbout();const t=$('aTitle');if(t)t.focus()}
 else if(a==='save')aboutSave();
 else if(a==='copy')copyText(aboutText(),'Đã sao chép nội dung');
 else if(a==='done'){if(aDirty)aboutSave();aEdit=false;renderAbout()}
 else if(a==='reset')armOnce('about-reset','Bấm biểu tượng ↺ lần nữa để khôi phục nội dung gốc (các chỉnh sửa sẽ mất).',()=>{about=cloneAbout(ABOUT_DEF);try{localStorage.removeItem('dsvn.about')}catch(e){}aDirty=false;renderAbout();toast('Đã khôi phục bản gốc')})
 else if(a==='add'){about.secs.push({h:'Mục mới',b:''});setDirty(true);renderAbout();const n=about.secs.length-1,h=$('aH'+n);if(h){h.focus();h.select();h.scrollIntoView({block:'center'})}}
 else{const[k,i]=a.split(':'),n=+i;
  if(k==='del'&&about.secs[n])armOnce('about-del-'+n,'Bấm “Xóa mục” lần nữa để xóa mục “'+about.secs[n].h+'”.',()=>{about.secs.splice(n,1);setDirty(true);renderAbout()});
  else if(k==='up'&&n>0){[about.secs[n-1],about.secs[n]]=[about.secs[n],about.secs[n-1]];setDirty(true);renderAbout()}
  else if(k==='down'&&n<about.secs.length-1){[about.secs[n+1],about.secs[n]]=[about.secs[n],about.secs[n+1]];setDirty(true);renderAbout()}}}
/* --- sự kiện chung --- */
document.querySelectorAll('nav button[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('back').onclick=()=>show(VIEWS.includes(from)?from:'places');
$('sMore').onclick=()=>{const o=$('sbox').classList.toggle('open');$('sMore').textContent=o?'Thu gọn ▴':'Liên quan ▾';$('sMore').setAttribute('aria-expanded',o)};
$('bInfo').onclick=()=>{if(sel)openModal(sel,'n')};
$('bMore').onclick=()=>{if(sel)openModal(sel,'m')};
$('pX').onclick=()=>{$('panel').classList.add('hide');if(spotIdx>=0)stopTour();syncHud()};
$('pQuiz').onclick=()=>{if(sel){const k='site:'+sel.id;show('quiz');quizMode(k)}};
$('pPrev').onclick=()=>step(-1);$('pNext').onclick=()=>step(1);
$('spots').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='tourBtn'){tour.on?stopTour():startTour()}else if(b.id==='siteInfo'){stopTour();info()}else if(b.dataset.j!==undefined)spot(+b.dataset.j)};
$('sTags').onclick=$('sNav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.site){show(b.dataset.site);return}
 const a=b.dataset.a,s=sel;
 if(a==='reg'){Object.assign(F,{reg:s.reg,type:'Tất cả',un:false,q:''});show('places')}
 else if(a==='type'){Object.assign(F,{reg:'Tất cả',type:s.type,un:false,q:''});show('places')}
 else if(a==='un'){Object.assign(F,{reg:'Tất cả',type:'Tất cả',un:true,q:''});show('places')}
 else if(a==='map'){mapFocus=s.id;show('map')}
 else if(a==='era'||a==='tl'){tlFocus=ERAS.indexOf(s.era);show('timeline')}};
$('view').onclick=e=>{const b=e.target.closest('[data-site],[data-go],[data-fk],[data-eid],[data-qm],[data-qa],[data-k],[data-jump],[data-jumpc],[data-ab]');if(!b)return;const d=b.dataset;
 if(d.site)show(d.site);
 else if(d.go)show(d.go);
 else if(d.qm)quizMode(d.qm);
 else if(d.qa)quizAct(d.qa);
 else if(d.k!==undefined&&b.classList.contains('opt'))answer(+d.k);
 else if(d.jump)show(d.jump);
 else if(d.jumpc){show(d.jumpc);openModal(byId[d.jumpc],'n')}
 else if(d.ab)aboutAct(d.ab);
 else if(d.eid!==undefined){const el=$('view').querySelector(`.era[data-eid="${d.eid}"]`);if(el)$('view').scrollTo({top:Math.max(0,el.getBoundingClientRect().top-$('view').getBoundingClientRect().top+$('view').scrollTop-100),behavior:RM?'auto':'smooth'})}
 else if(d.fk==='mapclear'){mapSel=-1;drawMap();mapList()}
 else if(d.fk){const k=d.fk;if(k==='un')F.un=!F.un;else F[k]=d.fv;
  document.querySelectorAll('.chip[data-fk]').forEach(c=>c.classList.toggle('on',c.dataset.fk==='un'?F.un:F[c.dataset.fk]===c.dataset.fv));grid()}};
$('view').addEventListener('input',e=>{if(view!=='about'||!aEdit)return;const t=e.target;
 if(t.id==='aTitle')about.title=t.value;else if(t.id==='aIntro')about.intro=t.value;
 else if(t.dataset&&t.dataset.f&&t.closest('.asecf'))about.secs[+t.closest('.asecf').dataset.i][t.dataset.f]=t.value;else return;
 if(!aDirty)setDirty(true)});
/* hộp thoại Nội dung / Xem thêm + phóng to ảnh */
$('mX').onclick=()=>closeModal();
$('modal').onclick=e=>{if(e.target===$('modal')){closeModal();return}
 const t=e.target.closest('[data-mt]');if(t){modalTab=t.dataset.mt;renderModal();$('mBody').scrollTop=0;return}
 const q=e.target.closest('[data-qm]');if(q){const k=q.dataset.qm;closeModal(true);show('quiz');quizMode(k)}};
document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.onclick=()=>{modalTab=b.dataset.t;renderModal();$('mBody').scrollTop=0});
$('lbX').onclick=()=>{$('lb').hidden=true};$('lb').onclick=e=>{if(e.target===$('lb'))$('lb').hidden=true};
document.addEventListener('click',e=>{const rb=e.target.closest&&e.target.closest('.rvb');if(rb){if(popBtn===rb)closePop();else openPop(rb);return}
 if(e.target.closest&&e.target.closest('#pop')){closePop();return}
 if(popBtn&&!(e.target.closest&&e.target.closest('.rv')))closePop();
 const im=e.target.closest&&e.target.closest('figure.ph img');if(im)openLb(im)});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.closest&&t.closest('figure.ph'))t.closest('figure.ph').remove()},true);
addEventListener('keydown',e=>{
 if(e.key==='Escape'&&popBtn){closePop();e.preventDefault();return}
 const cp=$('cpBox');if(cp&&!cp.hidden){if(e.key==='Escape'){cp.hidden=true;e.preventDefault()}else if(e.key==='Tab')trapTab(e,cp);return}
 if(!$('lb').hidden){if(e.key==='Escape'){$('lb').hidden=true;e.preventDefault()}else if(e.key==='Tab'){trapTab(e,$('lb'))}return}
 if(modalOpen){if(e.key==='Escape'){closeModal();e.preventDefault()}else if(e.key==='Tab')trapTab(e,$('modal'));return}
 if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')&&view==='about'&&aEdit){e.preventDefault();aboutSave();return}
 const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'');
 if(view==='quiz'&&qz&&!qz.end&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
  const k='1234'.indexOf(e.key);const kk=k>=0?k:'abcd'.indexOf(e.key.toLowerCase());
  if(kk>=0&&e.key.length===1){answer(kk);return}
  if(e.key==='Enter'&&qz.locked&&document.activeElement.tagName!=='BUTTON'){nextQ();return}}
 if(view!=='site'||typing)return;
 if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')$('back').click()});
addEventListener('resize',()=>{if(view==='map')drawMap()});
let last=performance.now(),frame=0;
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,((now||last)-last)/1000));last=now||last;
 if(!HAS3D)return;
 gs.vy=view==='site'&&innerWidth<=700&&!$('panel').classList.contains('hide')?.17:0;
 if(auto&&!ptrs.size&&!RM)gs.th+=dt*.045;
 if(inertia&&!ptrs.size){gs.th+=inertia*dt;inertia*=Math.exp(-dt*3);if(Math.abs(inertia)<.02)inertia=0}
 follow(dt);place();
 if(view!=='site'&&(frame++&3))return; /* khi chỉ làm nền cho các trang danh sách thì vẽ thưa hơn để đỡ tốn pin */
 sky.position.copy(camera.position);if(!RM)clouds.rotation.y+=dt*.004;
 renderer.render(scene,camera);
 if(view==='site')pinsUpdate(); /* sau khi vẽ: ma trận máy ảnh đã mới nhất nên ghim không bị trễ một khung hình */
 adapt(dt)})(last);
if(/[?&]dbg\b/.test(location.search))window.__dbg={info:()=>renderer&&{calls:renderer.info.render.calls,tris:renderer.info.render.triangles,pr},pins:()=>pinList.map(b=>({hidden:b.hidden,t:b.style.transform,o:b.style.opacity})),cs,gs,QS,SITES,lights:()=>({sun,hemi,renderer}),pinErr:()=>{camera.updateMatrixWorld();let m=0;pinList.forEach((b,i)=>{if(b.hidden)return;const q=pinPos[i];_pv.set(q[0],q[1],q[2]).project(camera);const sx=(_pv.x*.5+.5)*innerWidth-14,sy=(-_pv.y*.5+.5)*innerHeight-14,t=b.style.transform.match(/translate3?d?\(([-\d.]+)px,\s*([-\d.]+)px/);if(t)m=Math.max(m,Math.hypot(sx-+t[1],sy-+t[2]))});return m},seen:()=>seen,imgs:()=>IMGC};
show(location.hash.slice(1)||'places',false);
})();
</script></body></html>
